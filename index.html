<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>حساب کتابی</title>

<!-- ===================================================== -->
<!-- فونت‌های زیبا -->
<!-- ===================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- وزیرمتن -->
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- ایران‌سنس (از طریق CDN) -->
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<!-- فونت پویا (اختیاری) -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="manifest" href="data:application/json,{}">
<meta name="theme-color" content="#000" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* ===================================================== */
/* روتینگ و متغیرهای تم */
/* ===================================================== */
:root {
  /* تم تاریک (پیش‌فرض) */
  --bg-primary: #000000;
  --bg-secondary: #0d0d0d;
  --bg-card: #111111;
  --bg-input: #191919;
  --bg-hover: #222222;
  --bg-active: #2a2a2a;
  --border-color: #333333;
  --border-light: #222222;
  
  --text-primary: #ffffff;
  --text-secondary: #dddddd;
  --text-muted: #888888;
  --text-dim: #666666;
  
  --shadow-color: rgba(0,0,0,0.5);
  
  --accent-blue: #4a9eff;
  --accent-green: #7fd17f;
  --accent-orange: #ffa500;
  --accent-gold: #ffd700;
  --accent-purple: #9b59b6;
  --accent-red: #663333;
  
  --toast-bg: #222222;
  --modal-overlay: rgba(0,0,0,0.8);
  
  --font-main: 'Vazirmatn', 'IranSans', 'Tahoma', sans-serif;
  --font-display: 'Baloo 2', 'Vazirmatn', cursive;
  
  --transition-speed: 0.3s;
}

/* ===================================================== */
/* تم روشن */
/* ===================================================== */
[data-theme="light"] {
  --bg-primary: #f5f5f5;
  --bg-secondary: #ffffff;
  --bg-card: #ffffff;
  --bg-input: #f0f0f0;
  --bg-hover: #e8e8e8;
  --bg-active: #dddddd;
  --border-color: #cccccc;
  --border-light: #e0e0e0;
  
  --text-primary: #1a1a1a;
  --text-secondary: #333333;
  --text-muted: #666666;
  --text-dim: #999999;
  
  --shadow-color: rgba(0,0,0,0.1);
  
  --toast-bg: #333333;
  --modal-overlay: rgba(0,0,0,0.5);
}

/* ===================================================== */
/* استایل پایه */
/* ===================================================== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-main);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--transition-speed), color var(--transition-speed);
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg-primary);
  transition: background var(--transition-speed);
}

/* ===================================================== */
/* دکمه تغییر تم */
/* ===================================================== */
.theme-toggle {
  background: none;
  border: none;
  color: var(--text-primary);
  font-size: 22px;
  padding: 6px 10px;
  cursor: pointer;
  border-radius: 8px;
  transition: all var(--transition-speed);
}

.theme-toggle:active {
  background: var(--bg-hover);
}

/* ===================================================== */
/* تاپ بار */
/* ===================================================== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 16px;
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  background: var(--bg-primary);
  z-index: 10;
  transition: background var(--transition-speed), border-color var(--transition-speed);
}

.month-title {
  font-size: 20px;
  font-weight: 700;
  flex: 1;
  text-align: center;
  font-family: var(--font-display);
  letter-spacing: 0.5px;
  color: var(--text-primary);
  transition: color var(--transition-speed);
}

.icon-btn {
  background: none;
  border: none;
  color: var(--text-primary);
  font-size: 22px;
  padding: 6px 10px;
  cursor: pointer;
  border-radius: 8px;
  transition: all var(--transition-speed);
}

.icon-btn:active {
  background: var(--bg-hover);
}

/* ===================================================== */
/* دکمه‌های عملیاتی */
/* ===================================================== */
.month-actions {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  flex-wrap: wrap;
}

.ghost-btn {
  flex: 1;
  background: var(--bg-card);
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  padding: 10px;
  border-radius: 10px;
  font-size: 13px;
  cursor: pointer;
  min-width: 80px;
  text-align: center;
  font-family: var(--font-main);
  font-weight: 500;
  transition: all var(--transition-speed);
}

.ghost-btn:active {
  background: var(--bg-hover);
  transform: scale(0.97);
}

.submit-btn {
  background: #1a4a3a;
  color: #7fd17f;
  border: 2px solid #2a6a4a;
}

.submit-btn:active {
  background: #2a5a4a;
}

/* ===================================================== */
/* لیست آیتم‌ها */
/* ===================================================== */
.content {
  padding: 8px 16px 40px;
  flex: 1;
}

.items-list {
  list-style: none;
}

.item-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border-light);
  flex-wrap: wrap;
  transition: border-color var(--transition-speed);
}

.item-row.checked .item-name,
.item-row.checked .item-amount {
  text-decoration: line-through;
  color: var(--text-dim);
}

.item-row.advance .item-name,
.item-row.advance .item-amount {
  color: var(--accent-orange);
}

.item-row.important .item-name::before {
  content: "⭐ ";
  color: var(--accent-gold);
}

.item-checkbox {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  accent-color: var(--accent-blue);
  cursor: pointer;
}

.item-name {
  flex: 1;
  font-size: 17px;
  min-width: 80px;
  word-break: break-word;
  font-weight: 500;
  color: var(--text-primary);
  transition: color var(--transition-speed);
}

.item-amount {
  font-size: 17px;
  color: var(--text-secondary);
  min-width: 60px;
  text-align: left;
  font-weight: 600;
  transition: color var(--transition-speed);
}

.item-actions {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
  flex-wrap: wrap;
}

/* دکمه‌های عملیاتی روی آیتم */
.advance-btn {
  background: none;
  border: 1px solid var(--border-color);
  color: var(--accent-orange);
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition-speed);
  font-family: var(--font-main);
  font-weight: 500;
}

.advance-btn.active {
  background: var(--accent-orange);
  color: #000;
  border-color: var(--accent-orange);
}

.advance-btn:active {
  transform: scale(0.95);
}

.important-btn {
  background: none;
  border: 1px solid var(--border-color);
  color: var(--accent-gold);
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition-speed);
}

.important-btn.active {
  background: var(--accent-gold);
  color: #000;
  border-color: var(--accent-gold);
}

.important-btn:active {
  transform: scale(0.95);
}

.edit-btn {
  background: none;
  border: 1px solid var(--border-color);
  color: var(--accent-blue);
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition-speed);
}

.edit-btn:active {
  background: var(--accent-blue);
  color: #000;
}

.repeat-btn {
  background: none;
  border: 1px solid var(--border-color);
  color: var(--accent-purple);
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition-speed);
}

.repeat-btn.active {
  background: var(--accent-purple);
  color: #fff;
  border-color: var(--accent-purple);
}

.delete-item-btn {
  background: none;
  border: none;
  color: var(--accent-red);
  font-size: 20px;
  cursor: pointer;
  padding: 4px 8px;
  transition: all var(--transition-speed);
}

.delete-item-btn:active {
  transform: scale(0.9);
}

/* ===================================================== */
/* افزودن آیتم */
/* ===================================================== */
.add-item-row {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.add-item-row input {
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 10px;
  font-size: 15px;
  flex: 1;
  min-width: 80px;
  font-family: var(--font-main);
  transition: all var(--transition-speed);
}

.add-item-row input::placeholder {
  color: var(--text-dim);
}

.add-item-row input:focus {
  outline: none;
  border-color: var(--accent-blue);
}

#newItemName {
  flex: 2;
}

#newItemAmount {
  flex: 1;
  min-width: 0;
}

.add-btn {
  background: var(--accent-blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  font-family: var(--font-main);
  font-weight: 600;
  transition: all var(--transition-speed);
}

.add-btn:active {
  transform: scale(0.97);
  opacity: 0.8;
}

/* ===================================================== */
/* بخش خلاصه */
/* ===================================================== */
.summary-section {
  margin-top: 28px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: 16px;
  transition: all var(--transition-speed);
}

.summary-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  font-size: 16px;
}

.summary-row label {
  color: var(--text-muted);
  font-weight: 500;
  transition: color var(--transition-speed);
}

.summary-row.editable input {
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 15px;
  width: 130px;
  text-align: left;
  font-family: var(--font-main);
  transition: all var(--transition-speed);
}

.summary-row.editable input:focus {
  outline: none;
  border-color: var(--accent-blue);
}

.summary-value {
  font-weight: 700;
  font-size: 17px;
  color: var(--text-primary);
  transition: color var(--transition-speed);
}

.summary-value.advance-color {
  color: var(--accent-orange);
}

.summary-section hr {
  border: none;
  border-top: 1px solid var(--border-color);
  margin: 8px 0;
  transition: border-color var(--transition-speed);
}

.summary-row.formula {
  font-size: 14px;
  color: var(--text-muted);
}

.summary-row.formula .eq {
  color: var(--text-dim);
}

.summary-row.formula .summary-value {
  color: var(--accent-green);
}

/* ===================================================== */
/* نمودارها */
/* ===================================================== */
.charts-section {
  margin-top: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: 16px;
  transition: all var(--transition-speed);
}

.chart-container {
  margin: 10px 0;
  max-height: 200px;
  overflow: hidden;
}

.chart-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 0;
}

.chart-bar .label {
  min-width: 60px;
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 500;
  transition: color var(--transition-speed);
}

.chart-bar .bar-track {
  flex: 1;
  height: 20px;
  background: var(--bg-input);
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  transition: background var(--transition-speed);
}

.chart-bar .bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
  border-radius: 10px;
  transition: width 0.5s ease;
}

.chart-bar .bar-value {
  min-width: 50px;
  font-size: 13px;
  text-align: left;
  color: var(--text-secondary);
  font-weight: 600;
  transition: color var(--transition-speed);
}

.chart-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}

.chart-stats .stat-item {
  background: var(--bg-input);
  padding: 8px 12px;
  border-radius: 8px;
  text-align: center;
  transition: background var(--transition-speed);
}

.chart-stats .stat-item .stat-value {
  font-size: 18px;
  font-weight: 700;
  display: block;
  color: var(--text-primary);
  transition: color var(--transition-speed);
}

.chart-stats .stat-item .stat-label {
  font-size: 12px;
  color: var(--text-muted);
  transition: color var(--transition-speed);
}

/* ===================================================== */
/* مودال‌ها */
/* ===================================================== */
.modal {
  position: fixed;
  inset: 0;
  background: var(--modal-overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
  transition: background var(--transition-speed);
}

.modal.hidden {
  display: none;
}

.modal-box {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 14px;
  width: 100%;
  max-width: 420px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 16px;
  transition: all var(--transition-speed);
}

.modal-box.small {
  max-width: 320px;
  text-align: center;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-color);
  color: var(--text-primary);
  transition: all var(--transition-speed);
}

.modal-body {
  padding: 4px 0;
}

.history-list {
  list-style: none;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 8px;
  border-bottom: 1px solid var(--border-light);
  cursor: pointer;
  transition: all var(--transition-speed);
}

.history-item:active {
  background: var(--bg-hover);
}

.history-item .h-date {
  font-size: 15px;
  font-weight: 500;
  color: var(--text-primary);
  transition: color var(--transition-speed);
}

.history-item .h-info {
  font-size: 13px;
  color: var(--text-muted);
  transition: color var(--transition-speed);
}

/* ===================================================== */
/* تنظیمات */
/* ===================================================== */
.settings-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.settings-form label {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 6px;
  font-weight: 500;
  transition: color var(--transition-speed);
}

.settings-form input,
.settings-form textarea {
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 10px;
  font-size: 15px;
  direction: ltr;
  text-align: left;
  width: 100%;
  font-family: var(--font-main);
  transition: all var(--transition-speed);
}

.settings-form input:focus,
.settings-form textarea:focus {
  outline: none;
  border-color: var(--accent-blue);
}

.settings-form textarea {
  min-height: 60px;
  resize: vertical;
}

.settings-status {
  font-size: 13px;
  color: var(--accent-green);
  min-height: 18px;
  text-align: center;
}

/* ===================================================== */
/* دکمه‌های مودال */
/* ===================================================== */
.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.danger-btn {
  flex: 1;
  background: #4a1c1c;
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
  min-width: 80px;
  font-family: var(--font-main);
  font-weight: 600;
  transition: all var(--transition-speed);
}

.danger-btn:active {
  transform: scale(0.97);
}

.success-btn {
  flex: 1;
  background: #1a4a3a;
  color: var(--accent-green);
  border: none;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
  min-width: 80px;
  font-family: var(--font-main);
  font-weight: 600;
  transition: all var(--transition-speed);
}

.success-btn:active {
  transform: scale(0.97);
}

#confirmText {
  font-size: 15px;
  line-height: 1.6;
  color: var(--text-primary);
  transition: color var(--transition-speed);
}

/* ===================================================== */
/* Toast */
/* ===================================================== */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--toast-bg);
  color: #fff;
  padding: 12px 24px;
  border-radius: 8px;
  display: none;
  z-index: 200;
  font-size: 14px;
  max-width: 90%;
  text-align: center;
  border: 1px solid var(--border-color);
  font-family: var(--font-main);
  font-weight: 500;
  transition: all var(--transition-speed);
}

/* ===================================================== */
/* ویرایش */
/* ===================================================== */
.edit-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.edit-form input {
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 10px;
  font-size: 15px;
  font-family: var(--font-main);
  transition: all var(--transition-speed);
}

.edit-form input:focus {
  outline: none;
  border-color: var(--accent-blue);
}

/* ===================================================== */
/* ریسپانسیو */
/* ===================================================== */
@media (max-width: 400px) {
  .item-actions {
    width: 100%;
    justify-content: flex-start;
  }
  .item-actions button {
    font-size: 11px;
    padding: 3px 6px;
  }
  .month-actions .ghost-btn {
    font-size: 11px;
    padding: 8px;
    min-width: 60px;
  }
  .month-title {
    font-size: 17px;
  }
}

@media (display-mode: standalone) {
  .topbar {
    padding-top: 28px;
  }
}

/* ===================================================== */
/* اسکرول‌بار زیبا */
/* ===================================================== */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: var(--bg-primary);
  transition: background var(--transition-speed);
}

::-webkit-scrollbar-thumb {
  background: var(--border-color);
  border-radius: 10px;
  transition: background var(--transition-speed);
}

::-webkit-scrollbar-thumb:hover {
  background: var(--text-dim);
}
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <button id="prevMonthBtn" class="icon-btn" title="ماه قبل">‹</button>
    <div class="month-title" id="monthTitle">ماه جاری</div>
    <button id="themeToggle" class="theme-toggle" title="تغییر تم">🌙</button>
    <button id="settingsBtn" class="icon-btn" title="تنظیمات">⚙</button>
    <button id="nextMonthBtn" class="icon-btn" title="ماه بعد">›</button>
  </header>

  <div class="month-actions">
    <button id="historyBtn" class="ghost-btn">📋 تاریخچه</button>
    <button id="chartBtn" class="ghost-btn">📊 آمار</button>
    <button id="backupBtn" class="ghost-btn">💾 پشتیبان</button>
    <button id="newMonthBtn" class="ghost-btn">📅 ماه جدید</button>
    <button id="submitFinalBtn" class="ghost-btn submit-btn">📤 ثبت نهایی</button>
  </div>

  <main class="content">

    <section class="items-section">
      <ul id="itemsList" class="items-list"></ul>

      <div class="add-item-row">
        <input type="text" id="newItemName" placeholder="اسم آیتم">
        <input type="number" id="newItemAmount" placeholder="مبلغ">
        <button id="addItemBtn" class="add-btn">+ افزودن</button>
      </div>
    </section>

    <section class="summary-section">
      <div class="summary-row">
        <label>خرج از کل</label>
        <div class="summary-value" id="totalSpent">۰</div>
      </div>

      <div class="summary-row">
        <label style="color: var(--accent-orange);">خرج از دادگی</label>
        <div class="summary-value advance-color" id="advanceSpent">۰</div>
      </div>

      <div class="summary-row editable">

<script>
// =====================================================
// کتابخانه تبدیل تاریخ شمسی
// =====================================================
function gregorianToJalali(gy, gm, gd) {
  const g_days_in_month = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  const j_days_in_month = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 29];

  function isLeap(year) {
    return ((year % 4) === 0 && (year % 100) !== 0) || (year % 400) === 0;
  }

  let gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = 0;
  for (let i = 0; i < gm - 1; i++) {
    days += g_days_in_month[i];
    if (i === 1 && isLeap(gy)) days++;
  }
  days += gd - 1;

  let jy = gy2 - 621;
  let jm = 0;
  let jd = 0;

  for (let i = 0; i < 12; i++) {
    let j_days = j_days_in_month[i];
    if (i === 11 && isLeap(jy + 621)) j_days = 30;
    if (days < j_days) {
      jm = i + 1;
      jd = days + 1;
      break;
    }
    days -= j_days;
  }

  return { year: jy, month: jm, day: jd };
}

function toPersianDate(date) {
  const j = gregorianToJalali(
    date.getFullYear(),
    date.getMonth() + 1,
    date.getDate()
  );
  const monthNames = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
  return `${j.day} ${monthNames[j.month - 1]} ${j.year}`;
}

function monthKeyToJalali(key) {
  const [y, m] = key.split('-').map(Number);
  const j = gregorianToJalali(y, m, 1);
  const monthNames = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
  return `${monthNames[j.month - 1]} ${j.year}`;
}

// =====================================================
// Helpers
// =====================================================
const toFa = (num) => {
  const n = Math.round(Number(num) || 0);
  return n.toLocaleString('fa-IR');
};

const monthKey = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;

const monthLabel = (key) => {
  if (!key) return 'نامشخص';
  
  try {
    const [y, m] = key.split('-').map(Number);
    
    if (isNaN(y) || isNaN(m) || m < 1 || m > 12) {
      return 'نامشخص';
    }
    
    const j = gregorianToJalali(y, m, 1);
    const monthNames = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
    return `${monthNames[j.month - 1]} ${j.year}`;
  } catch (e) {
    console.error('Error in monthLabel:', e);
    return 'نامشخص';
  }
};

const STORAGE_PREFIX = 'budget_month_';
const CURRENT_KEY = 'budget_current_month';
const SETTINGS_KEY = 'budget_telegram_settings';
const CHANGES_KEY = 'budget_pending_changes';
const REPEAT_KEY = 'budget_repeat_items';
const THEME_KEY = 'budget_theme';

// =====================================================
// Theme
// =====================================================
function getTheme() {
  return localStorage.getItem(THEME_KEY) || 'dark';
}

function setTheme(theme) {
  localStorage.setItem(THEME_KEY, theme);
  document.documentElement.setAttribute('data-theme', theme);
  const meta = document.getElementById('themeColorMeta');
  if (theme === 'light') {
    meta.content = '#f5f5f5';
    document.getElementById('themeToggle').textContent = '🌙';
  } else {
    meta.content = '#000000';
    document.getElementById('themeToggle').textContent = '☀️';
  }
}

function toggleTheme() {
  const current = getTheme();
  setTheme(current === 'dark' ? 'light' : 'dark');
}

// =====================================================
// State
// =====================================================
let currentMonthKey = localStorage.getItem(CURRENT_KEY) || monthKey(new Date());
let state = loadMonth(currentMonthKey);
let pendingChanges = loadPendingChanges();
let editItemId = null;

function defaultState() {
  return {
    items: [],
    totalSalary: '',
    advanceTaken: '',
    closed: false
  };
}

function loadMonth(key) {
  const raw = localStorage.getItem(STORAGE_PREFIX + key);
  return raw ? JSON.parse(raw) : defaultState();
}

function saveMonth(key, data) {
  localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(data));
}

function saveCurrentPointer(key) {
  localStorage.setItem(CURRENT_KEY, key);
}

function loadPendingChanges() {
  const raw = localStorage.getItem(CHANGES_KEY);
  return raw ? JSON.parse(raw) : { items: [], lastSubmit: null };
}

function savePendingChanges() {
  localStorage.setItem(CHANGES_KEY, JSON.stringify(pendingChanges));
}

function loadRepeatItems() {
  const raw = localStorage.getItem(REPEAT_KEY);
  return raw ? JSON.parse(raw) : [];
}

function saveRepeatItems(items) {
  localStorage.setItem(REPEAT_KEY, JSON.stringify(items));
}

function listAllMonthKeys() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith(STORAGE_PREFIX)) keys.push(k.replace(STORAGE_PREFIX, ''));
  }
  return keys.sort().reverse();
}

// =====================================================
// Telegram
// =====================================================
function getTelegramSettings() {
  const raw = localStorage.getItem(SETTINGS_KEY);
  return raw ? JSON.parse(raw) : { token: '', chatId: '' };
}

function saveTelegramSettings(token, chatId) {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify({ token, chatId }));
}

async function sendTelegramMessage(text) {
  const { token, chatId } = getTelegramSettings();
  if (!token || !chatId) {
    showToast('تنظیمات تلگرام کامل نیست!');
    return false;
  }
  try {
    const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: chatId, text })
    });
    const data = await response.json();
    if (!data.ok) {
      throw new Error(data.description || 'خطای ناشناخته');
    }
    return true;
  } catch (err) {
    console.error('Telegram send failed:', err);
    showToast('ارسال به تلگرام ناموفق بود: ' + err.message);
    return false;
  }
}

// =====================================================
// Toast
// =====================================================
function showToast(message, duration = 3000) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.style.display = 'block';
  clearTimeout(toast.timeout);
  toast.timeout = setTimeout(() => {
    toast.style.display = 'none';
  }, duration);
}

// =====================================================
// Calculations
// =====================================================
function calcTotals() {
  const spentFromSalary = state.items
    .filter(i => i.checked && !i.isAdvance)
    .reduce((sum, i) => sum + (Number(i.amount) || 0), 0);
  
  const spentFromAdvance = state.items
    .filter(i => i.checked && i.isAdvance)
    .reduce((sum, i) => sum + (Number(i.amount) || 0), 0);
  
  const salary = Number(state.totalSalary) || 0;
  const advance = Number(state.advanceTaken) || 0;
  
  const remainingAdvance = advance - spentFromAdvance;
  const remainingSalary = salary - advance - spentFromSalary;
  
  return { 
    spentFromSalary, 
    spentFromAdvance, 
    salary, 
    advance, 
    remainingAdvance,
    remainingSalary,
    totalSpent: spentFromSalary + spentFromAdvance
  };
}

// =====================================================
// Track Changes
// =====================================================
function trackChange(type, data) {
  const now = new Date();
  pendingChanges.items.push({
    type: type,
    data: data,
    timestamp: now.toISOString(),
    persianDate: toPersianDate(now)
  });
  savePendingChanges();
}

// =====================================================
// Submit Final - بدون تاریخ در بخش تغییرات
// =====================================================
async function submitFinal() {
  if (pendingChanges.items.length === 0) {
    showToast('هیچ تغییر جدیدی برای ثبت وجود ندارد');
    return;
  }

  const { spentFromSalary, spentFromAdvance, salary, advance, remainingAdvance, remainingSalary } = calcTotals();
  
  let changesText = '📋 *تغییرات جدید:*\n';
  pendingChanges.items.forEach((change, index) => {
    let desc = '';
    if (change.type === 'toggle') {
      const status = change.data.checked ? '✅ پرداخت شد' : '❌ لغو پرداخت';
      const from = change.data.isAdvance ? ' (از دادگی)' : ' (از کل)';
      desc = `${status}${from}: ${change.data.name} (${toFa(change.data.amount)} ریال)`;
    } else if (change.type === 'add') {
      const star = change.data.important ? ' ⭐' : '';
      desc = `➕ افزوده شد${star}: ${change.data.name} (${toFa(change.data.amount)} ریال)`;
    } else if (change.type === 'delete') {
      desc = `🗑️ حذف شد: ${change.data.name} (${toFa(change.data.amount)} ریال)`;
    } else if (change.type === 'advance') {
      const status = change.data.isAdvance ? '🔶 از دادگی' : '🔷 از کل';
      desc = `تغییر منبع: ${change.data.name} → ${status}`;
    } else if (change.type === 'important') {
      const status = change.data.important ? '⭐ مهم' : '🔹 عادی';
      desc = `تغییر اهمیت: ${change.data.name} → ${status}`;
    } else if (change.type === 'edit') {
      desc = `✏️ ویرایش: ${change.data.name} (${toFa(change.data.amount)} ریال)`;
    }
    changesText += `${index + 1}. ${desc}\n`;
  });

  const currentMonthName = monthLabel(currentMonthKey);
  
  const summaryText = 
    `📊 *خلاصه وضعیت مالی - ${currentMonthName}*\n\n` +
    `💰 کل: ${toFa(salary)} ریال\n` +
    `📤 دادگی: ${toFa(advance)} ریال\n` +
    `💸 خرج از کل: ${toFa(spentFromSalary)} ریال\n` +
    `🔶 خرج از دادگی: ${toFa(spentFromAdvance)} ریال\n` +
    `📈 دادگی باقی‌مانده: ${toFa(remainingAdvance)} ریال\n` +
    `🎯 مانده نهایی: ${toFa(remainingSalary)} ریال\n\n` +
    changesText;

  const success = await sendTelegramMessage(summaryText);
  
  if (success) {
    pendingChanges.items = [];
    pendingChanges.lastSubmit = new Date().toISOString();
    savePendingChanges();
    showToast('✅ ثبت نهایی با موفقیت انجام شد!');
  }
}

// =====================================================
// Render
// =====================================================
function render() {
  document.getElementById('monthTitle').textContent = monthLabel(currentMonthKey);

  const list = document.getElementById('itemsList');
  list.innerHTML = '';
  state.items.forEach(item => {
    const li = document.createElement('li');
    li.className = 'item-row' + 
      (item.checked ? ' checked' : '') + 
      (item.isAdvance ? ' advance' : '') +
      (item.important ? ' important' : '');

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'item-checkbox';
    cb.checked = item.checked;
    cb.addEventListener('change', () => onToggleItem(item.id, cb.checked));

    const name = document.createElement('span');
    name.className = 'item-name';
    name.textContent = item.name;

    const amount = document.createElement('span');
    amount.className = 'item-amount';
    amount.textContent = toFa(item.amount);

    const actions = document.createElement('div');
    actions.className = 'item-actions';

    const advanceBtn = document.createElement('button');
    advanceBtn.className = 'advance-btn' + (item.isAdvance ? ' active' : '');
    advanceBtn.textContent = 'دادگی';
    advanceBtn.title = 'پرداخت از دادگی';
    advanceBtn.addEventListener('click', () => onToggleAdvance(item.id));

    const importantBtn = document.createElement('button');
    importantBtn.className = 'important-btn' + (item.important ? ' active' : '');
    importantBtn.textContent = '⭐';
    importantBtn.title = 'علامت‌گذاری به عنوان مهم';
    importantBtn.addEventListener('click', () => onToggleImportant(item.id));

    const editBtn = document.createElement('button');
    editBtn.className = 'edit-btn';
    editBtn.textContent = '✏️';
    editBtn.title = 'ویرایش';
    editBtn.addEventListener('click', () => openEditModal(item.id));

    const repeatBtn = document.createElement('button');
    repeatBtn.className = 'repeat-btn' + (item.repeat ? ' active' : '');
    repeatBtn.textContent = '🔄';
    repeatBtn.title = 'تکرار ماهانه';
    repeatBtn.addEventListener('click', () => onToggleRepeat(item.id));

    const del = document.createElement('button');
    del.className = 'delete-item-btn';
    del.textContent = '×';
    del.addEventListener('click', () => onDeleteItem(item.id));

    actions.appendChild(advanceBtn);
    actions.appendChild(importantBtn);
    actions.appendChild(editBtn);
    actions.appendChild(repeatBtn);
    actions.appendChild(del);

    li.appendChild(cb);
    li.appendChild(name);
    li.appendChild(amount);
    li.appendChild(actions);
    list.appendChild(li);
  });

  document.getElementById('totalSalary').value = state.totalSalary;
  document.getElementById('advanceTaken').value = state.advanceTaken;

  const { spentFromSalary, spentFromAdvance, remainingSalary, remainingAdvance } = calcTotals();
  document.getElementById('totalSpent').textContent = toFa(spentFromSalary);
  document.getElementById('advanceSpent').textContent = toFa(spentFromAdvance);
  document.getElementById('remainingSalary').textContent = toFa(remainingSalary);
  document.getElementById('finalLeft').textContent = toFa(remainingAdvance);

  saveMonth(currentMonthKey, state);
}

// =====================================================
// Event Handlers
// =====================================================
function onToggleItem(id, checked) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  item.checked = checked;
  
  trackChange('toggle', {
    id: item.id,
    name: item.name,
    amount: item.amount,
    checked: checked,
    isAdvance: item.isAdvance || false
  });
  
  render();
}

function onToggleAdvance(id) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  
  if (item.checked) {
    showToast('ابتدا تیک آیتم را بردارید تا بتوانید منبع آن را تغییر دهید');
    return;
  }
  
  item.isAdvance = !item.isAdvance;
  
  trackChange('advance', {
    id: item.id,
    name: item.name,
    isAdvance: item.isAdvance
  });
  
  render();
  showToast(`آیتم "${item.name}" ${item.isAdvance ? 'از دادگی' : 'از کل'} پرداخت می‌شود`);
}

function onToggleImportant(id) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  
  item.important = !item.important;
  
  trackChange('important', {
    id: item.id,
    name: item.name,
    important: item.important
  });
  
  render();
  showToast(item.important ? '⭐ مهم شد' : '🔹 عادی شد');
}

function onToggleRepeat(id) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  
  item.repeat = !item.repeat;
  
  const repeatItems = loadRepeatItems();
  if (item.repeat) {
    repeatItems.push({ name: item.name, amount: item.amount });
  } else {
    const index = repeatItems.findIndex(r => r.name === item.name && r.amount === item.amount);
    if (index > -1) repeatItems.splice(index, 1);
  }
  saveRepeatItems(repeatItems);
  
  render();
  showToast(item.repeat ? '🔄 به لیست تکراری‌ها اضافه شد' : 'از لیست تکراری‌ها حذف شد');
}

function onDeleteItem(id) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  
  trackChange('delete', {
    id: item.id,
    name: item.name,
    amount: item.amount
  });
  
  state.items = state.items.filter(i => i.id !== id);
  render();
  showToast(`آیتم "${item.name}" حذف شد`);
}

function onAddItem() {
  const nameInput = document.getElementById('newItemName');
  const amountInput = document.getElementById('newItemAmount');
  const name = nameInput.value.trim();
  const amount = amountInput.value.trim();
  if (!name || !amount) {
    showToast('لطفاً نام و مبلغ را وارد کنید');
    return;
  }

  const newItem = {
    id: Date.now().toString(),
    name,
    amount: Number(amount),
    checked: false,
    isAdvance: false,
    important: false,
    repeat: false
  };

  trackChange('add', {
    id: newItem.id,
    name: newItem.name,
    amount: newItem.amount,
    important: newItem.important
  });

  state.items.push(newItem);
  nameInput.value = '';
  amountInput.value = '';
  render();
  showToast(`آیتم "${name}" اضافه شد`);
}

function openEditModal(id) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  
  editItemId = id;
  document.getElementById('editName').value = item.name;
  document.getElementById('editAmount').value = item.amount;
  document.getElementById('editModal').classList.remove('hidden');
}

function saveEdit() {
  if (!editItemId) return;
  
  const item = state.items.find(i => i.id === editItemId);
  if (!item) return;
  
  const newName = document.getElementById('editName').value.trim();
  const newAmount = document.getElementById('editAmount').value.trim();
  
  if (!newName || !newAmount) {
    showToast('لطفاً نام و مبلغ را وارد کنید');
    return;
  }
  
  trackChange('edit', {
    id: item.id,
    name: newName,
    amount: Number(newAmount)
  });
  
  item.name = newName;
  item.amount = Number(newAmount);
  
  document.getElementById('editModal').classList.add('hidden');
  render();
  showToast('آیتم ویرایش شد');
}

function switchToMonth(key) {
  if (pendingChanges.items.length > 0) {
    showToast('ابتدا تغییرات را با دکمه "ثبت نهایی" ارسال کنید!');
    return;
  }
  
  currentMonthKey = key;
  state = loadMonth(key);
  saveCurrentPointer(key);
  render();
}

function shiftMonth(delta) {
  if (pendingChanges.items.length > 0) {
    showToast('ابتدا تغییرات را با دکمه "ثبت نهایی" ارسال کنید!');
    return;
  }
  
  const [y, m] = currentMonthKey.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  switchToMonth(monthKey(d));
}

function startNewMonth() {
  if (pendingChanges.items.length > 0) {
    showToast('ابتدا تغییرات را با دکمه "ثبت نهایی" ارسال کنید!');
    return;
  }

  const repeatItems = loadRepeatItems();
  repeatItems.forEach(item => {
    state.items.push({
      id: Date.now().toString() + '_' + Math.random().toString(36).substr(2, 4),
      name: item.name,
      amount: Number(item.amount),
      checked: false,
      isAdvance: false,
      important: false,
      repeat: true
    });
  });

  const { spentFromSalary, spentFromAdvance, salary, advance, remainingAdvance, remainingSalary } = calcTotals();
  
  const currentMonthName = monthLabel(currentMonthKey);
  
  const summary =
    `📅 *خلاصه ماه ${currentMonthName}*\n\n` +
    `💰 کل: ${toFa(salary)} ریال\n` +
    `📤 دادگی: ${toFa(advance)} ریال\n` +
    `💸 خرج از کل: ${toFa(spentFromSalary)} ریال\n` +
    `🔶 خرج از دادگی: ${toFa(spentFromAdvance)} ریال\n` +
    `📈 دادگی باقی‌مانده: ${toFa(remainingAdvance)} ریال\n` +
    `🎯 مانده نهایی: ${toFa(remainingSalary)} ریال`;
  sendTelegramMessage(summary);

  state.closed = true;
  saveMonth(currentMonthKey, state);

  const [y, m] = currentMonthKey.split('-').map(Number);
  const nextDate = new Date(y, m, 1);
  const nextKey = monthKey(nextDate);
  currentMonthKey = nextKey;
  state = defaultState();
  saveCurrentPointer(nextKey);
  render();
  showToast('ماه جدید شروع شد');
}

// =====================================================
// History
// =====================================================
function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  const keys = listAllMonthKeys();

  if (keys.length === 0) {
    list.innerHTML = '<li class="history-item"><span class="h-info">هنوز ماهی ثبت نشده</span></li>';
    return;
  }

  keys.forEach(key => {
    const data = loadMonth(key);
    const spentFromSalary = data.items
      .filter(i => i.checked && !i.isAdvance)
      .reduce((s, i) => s + (Number(i.amount) || 0), 0);
    const spentFromAdvance = data.items
      .filter(i => i.checked && i.isAdvance)
      .reduce((s, i) => s + (Number(i.amount) || 0), 0);
    const totalItems = data.items.length;

    const li = document.createElement('li');
    li.className = 'history-item';

    const left = document.createElement('span');
    left.className = 'h-date';
    left.textContent = monthLabel(key);

    const right = document.createElement('span');
    right.className = 'h-info';
    right.textContent = `کل: ${toFa(spentFromSalary)} | دادگی: ${toFa(spentFromAdvance)} | ${totalItems} آیتم`;

    li.appendChild(left);
    li.appendChild(right);
    li.addEventListener('click', () => {
      switchToMonth(key);
      document.getElementById('historyModal').classList.add('hidden');
    });
    list.appendChild(li);
  });
}

// =====================================================
// Charts
// =====================================================
function renderCharts() {
  const stats = document.getElementById('chartStats');
  const container = document.getElementById('chartContainer');
  
  const allKeys = listAllMonthKeys().slice(0, 6);
  const currentData = calcTotals();
  
  stats.innerHTML = `
    <div class="stat-item">
      <span class="stat-value">${toFa(currentData.totalSpent)}</span>
      <span class="stat-label">جمع کل خرج</span>
    </div>
    <div class="stat-item">
      <span class="stat-value">${toFa(currentData.remainingSalary)}</span>
      <span class="stat-label">باقی‌مانده نهایی</span>
    </div>
    <div class="stat-item">
      <span class="stat-value">${state.items.length}</span>
      <span class="stat-label">تعداد آیتم‌ها</span>
    </div>
    <div class="stat-item">
      <span class="stat-value">${toFa(currentData.advance)}</span>
      <span class="stat-label">دادگی کل</span>
    </div>
  `;
  
  let chartHTML = '<div style="margin-top:16px;"><div style="font-size:14px;color:var(--text-muted);margin-bottom:8px;">مقایسه خرج ماه‌های اخیر:</div>';
  
  const maxSpent = Math.max(...allKeys.map(k => {
    const data = loadMonth(k);
    return data.items.filter(i => i.checked).reduce((s, i) => s + (Number(i.amount) || 0), 0);
  }), 1);
  
  allKeys.slice(0, 6).forEach(key => {
    const data = loadMonth(key);
    const spent = data.items.filter(i => i.checked).reduce((s, i) => s + (Number(i.amount) || 0), 0);
    const percentage = Math.max((spent / maxSpent) * 100, 5);
    
    chartHTML += `
      <div class="chart-bar">
        <span class="label">${monthLabel(key)}</span>
        <div class="bar-track">
          <div class="bar-fill" style="width:${percentage}%;"></div>
        </div>
        <span class="bar-value">${toFa(spent)}</span>
      </div>
    `;
  });
  
  chartHTML += '</div>';
  container.innerHTML = chartHTML;
}

// =====================================================
// Backup
// =====================================================
function exportBackup() {
  const data = {
    version: '1.0',
    exportDate: new Date().toISOString(),
    months: {},
    settings: getTelegramSettings(),
    repeatItems: loadRepeatItems()
  };
  
  const keys = listAllMonthKeys();
  keys.forEach(key => {
    data.months[key] = loadMonth(key);
  });
  
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `budget_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  
  document.getElementById('backupStatus').textContent = '✅ خروجی گرفته شد';
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      
      if (!data.months || typeof data.months !== 'object') {
        throw new Error('فرمت فایل نامعتبر است');
      }
      
      Object.keys(data.months).forEach(key => {
        saveMonth(key, data.months[key]);
      });
      
      if (data.settings) {
        saveTelegramSettings(data.settings.token || '', data.settings.chatId || '');
      }
      
      if (data.repeatItems) {
        saveRepeatItems(data.repeatItems);
      }
      
      switchToMonth(currentMonthKey);
      document.getElementById('backupStatus').textContent = '✅ بازیابی با موفقیت انجام شد';
      showToast('✅ اطلاعات با موفقیت بازیابی شد');
    } catch (err) {
      document.getElementById('backupStatus').textContent = '❌ خطا: ' + err.message;
      showToast('❌ خطا در بازیابی: ' + err.message);
    }
  };
  reader.readAsText(file);
}

document.getElementById('settingsBtn').addEventListener('click', () => {
  const { token, chatId } = getTelegramSettings();
  const repeatItems = loadRepeatItems();
  document.getElementById('botToken').value = token;
  document.getElementById('chatId').value = chatId;
  document.getElementById('repeatItems').value = repeatItems.map(i => `${i.name},${i.amount}`).join('\n');
  document.getElementById('settingsStatus').textContent = '';
  document.getElementById('settingsModal').classList.remove('hidden');
});
document.getElementById('closeSettingsBtn').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.add('hidden');
});
document.getElementById('saveSettingsBtn').addEventListener('click', () => {
  const token = document.getElementById('botToken').value.trim();
  const chatId = document.getElementById('chatId').value.trim();
  const repeatText = document.getElementById('repeatItems').value.trim();
  
  saveTelegramSettings(token, chatId);
  
  const repeatItems = repeatText.split('\n')
    .filter(line => line.trim())
    .map(line => {
      const [name, amount] = line.split(',').map(s => s.trim());
      return { name, amount: Number(amount) || 0 };
    })
    .filter(item => item.name && item.amount > 0);
  saveRepeatItems(repeatItems);
  
  document.getElementById('settingsStatus').textContent = '✅ ذخیره شد';
  showToast('تنظیمات ذخیره شد');
});
