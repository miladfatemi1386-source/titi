<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>حساب کتابی</title>

<!-- ===================================================== -->
<!-- فونت‌های زیبا -->
<!-- ===================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- وزیرمتن -->
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- ایران‌سنس (از طریق CDN) -->
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<!-- فونت پویا (اختیاری) -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="manifest" href="data:application/json,{}">
<meta name="theme-color" content="#000" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* ===================================================== */
/* روتینگ و متغیرهای تم */
/* ===================================================== */
:root {
  --bg-primary: #1e2128;
  --bg-secondary: #1e2128;
  --bg-card: #1e2128;
  --bg-input: #1e2128;
  --bg-hover: #23262e;
  --bg-active: #23262e;
  --border-color: transparent;
  --border-light: rgba(255,255,255,0.04);

  --text-primary: #eef0f4;
  --text-secondary: #c3c7d1;
  --text-muted: #888e9c;
  --text-dim: #666c7a;

  --shadow-color: rgba(0,0,0,0.5);
  --shadow-dark: #14161b;
  --shadow-light: #282c36;

  --accent-blue: #5aa6ff;
  --accent-green: #7fd17f;
  --accent-orange: #ffa94d;
  --accent-gold: #ffd76a;
  --accent-purple: #b07cd6;
  --accent-red: #d17f7f;

  --toast-bg: #23262e;
  --modal-overlay: rgba(10,11,14,0.75);

  --font-main: 'Vazirmatn', 'IranSans', 'Tahoma', sans-serif;
  --font-display: 'Baloo 2', 'Vazirmatn', cursive;

  --transition-speed: 0.4s;
  --bounce-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
  --smooth-ease: cubic-bezier(0.4, 0, 0.2, 1);

  --nm-flat: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
  --nm-flat-sm: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
  --nm-pressed: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
  --nm-pressed-sm: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
}

/* ===================================================== */
/* تم روشن */
/* ===================================================== */
[data-theme="light"] {
  --bg-primary: #e6e9ef;
  --bg-secondary: #e6e9ef;
  --bg-card: #e6e9ef;
  --bg-input: #e6e9ef;
  --bg-hover: #dde1e8;
  --bg-active: #dde1e8;
  --border-color: transparent;
  --border-light: rgba(0,0,0,0.05);

  --text-primary: #2e3138;
  --text-secondary: #4a4e58;
  --text-muted: #767b87;
  --text-dim: #9aa0ab;

  --shadow-color: rgba(0,0,0,0.1);
  --shadow-dark: #c5c9d1;
  --shadow-light: #ffffff;

  --toast-bg: #4a4e58;
  --modal-overlay: rgba(60,64,74,0.45);
}

/* ===================================================== */
/* استایل پایه */
/* ===================================================== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-main);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--transition-speed) var(--smooth-ease), color var(--transition-speed) var(--smooth-ease);
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg-primary);
  transition: background var(--transition-speed) var(--smooth-ease);
}

/* ===================================================== */
/* دکمه تغییر تم */
/* ===================================================== */
.theme-toggle {
  background: var(--bg-primary);
  border: none;
  color: var(--text-primary);
  font-size: 18px;
  width: 40px;
  height: 40px;
  padding: 0;
  cursor: pointer;
  border-radius: 12px;
  box-shadow: var(--nm-flat-sm);
  transition: all 0.3s var(--bounce-ease);
}

.theme-toggle:active {
  transform: scale(0.92) translateY(2px);
  box-shadow: var(--nm-pressed-sm);
}

/* ===================================================== */
/* تاپ بار */
/* ===================================================== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 16px;
  border-bottom: none;
  position: sticky;
  top: 0;
  background: var(--bg-primary);
  z-index: 10;
  transition: background var(--transition-speed) var(--smooth-ease);
}

.month-title {
  font-size: 20px;
  font-weight: 700;
  flex: 1;
  text-align: center;
  font-family: var(--font-display);
  letter-spacing: 0.5px;
  color: var(--text-primary);
  transition: color var(--transition-speed) var(--smooth-ease), transform 0.3s var(--bounce-ease);
}

.month-title.slide-left {
  animation: slideLeft 0.3s var(--smooth-ease);
}

.month-title.slide-right {
  animation: slideRight 0.3s var(--smooth-ease);
}

@keyframes slideLeft {
  from { opacity: 0.3; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes slideRight {
  from { opacity: 0.3; transform: translateX(-30px); }
  to { opacity: 1; transform: translateX(0); }
}

.icon-btn {
  background: var(--bg-primary);
  border: none;
  color: var(--text-primary);
  font-size: 18px;
  width: 40px;
  height: 40px;
  padding: 0;
  cursor: pointer;
  border-radius: 12px;
  box-shadow: var(--nm-flat-sm);
  transition: all 0.3s var(--bounce-ease);
}

.icon-btn:active {
  transform: scale(0.92) translateY(2px);
  box-shadow: var(--nm-pressed-sm);
}

/* ===================================================== */
/* دکمه‌های عملیاتی */
/* ===================================================== */
.month-actions {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  flex-wrap: wrap;
}

.ghost-btn {
  flex: 1;
  background: var(--bg-primary);
  color: var(--text-secondary);
  border: none;
  padding: 10px;
  border-radius: 12px;
  font-size: 13px;
  cursor: pointer;
  min-width: 80px;
  text-align: center;
  font-family: var(--font-main);
  font-weight: 500;
  box-shadow: var(--nm-flat-sm);
  transition: all 0.3s var(--bounce-ease);
}

.ghost-btn:active {
  transform: scale(0.95) translateY(2px);
  box-shadow: var(--nm-pressed-sm);
}

.submit-btn {
  background: var(--bg-primary);
  color: #7fd17f;
}

.submit-btn:active {
  transform: scale(0.95) translateY(2px);
  box-shadow: var(--nm-pressed-sm);
}

/* ===================================================== */
/* لیست آیتم‌ها */
/* ===================================================== */
.content {
  padding: 8px 16px 40px;
  flex: 1;
}

.items-list {
  list-style: none;
}

.item-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border-light);
  flex-wrap: wrap;
  transition: all 0.4s var(--smooth-ease);
  animation: itemAppear 0.4s var(--bounce-ease) forwards;
}

.item-row.removing {
  animation: itemRemove 0.35s var(--smooth-ease) forwards;
}

@keyframes itemAppear {
  from {
    opacity: 0;
    transform: translateY(-16px) scale(0.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes itemRemove {
  from {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
  to {
    opacity: 0;
    transform: translateX(80px) scale(0.85);
  }
}

/* آیتم کامل پرداخت شده */
.item-row.paid .item-name,
.item-row.paid .item-amount,
.item-row.paid .item-detail {
  color: var(--text-dim);
  opacity: 0.7;
}

.item-row.paid .item-name {
  position: relative;
}

.item-row.paid .item-name::after {
  content: '';
  position: absolute;
  top: 50%;
  right: 0;
  width: 100%;
  height: 2px;
  background: var(--text-dim);
  border-radius: 2px;
  animation: strikeThrough 0.45s var(--smooth-ease) forwards;
}

@keyframes strikeThrough {
  from { transform: scaleX(0); transform-origin: right; }
  to { transform: scaleX(1); transform-origin: right; }
}

.item-row:not(.paid) .item-name::after {
  animation: unStrikeThrough 0.35s var(--smooth-ease) forwards;
}

@keyframes unStrikeThrough {
  from { transform: scaleX(1); transform-origin: left; }
  to { transform: scaleX(0); transform-origin: left; }
}

.item-row.important .item-name::before {
  content: "⭐ ";
  color: var(--accent-gold);
}

/* نمایش جزئیات پرداخت */
.item-detail {
  font-size: 13px;
  color: var(--text-muted);
  min-width: 60px;
  text-align: left;
  font-weight: 500;
  transition: color 0.4s var(--smooth-ease), opacity 0.4s var(--smooth-ease);
  direction: ltr;
}

.item-detail .advance-part {
  color: var(--accent-orange);
}
.item-detail .salary-part {
  color: var(--accent-blue);
}

.item-name {
  flex: 1;
  font-size: 17px;
  min-width: 80px;
  word-break: break-word;
  font-weight: 500;
  color: var(--text-primary);
  transition: color 0.4s var(--smooth-ease), opacity 0.4s var(--smooth-ease);
}

.item-amount {
  font-size: 17px;
  color: var(--text-secondary);
  min-width: 60px;
  text-align: left;
  font-weight: 600;
  transition: color 0.4s var(--smooth-ease), opacity 0.4s var(--smooth-ease);
}

.item-actions {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
  flex-wrap: wrap;
}

/* دکمه‌های عملیاتی روی آیتم */
.advance-btn {
  background: var(--bg-primary);
  border: none;
  color: var(--accent-orange);
  font-size: 12px;
  padding: 5px 9px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: var(--nm-flat-sm);
  transition: all 0.3s var(--bounce-ease);
  font-family: var(--font-main);
  font-weight: 500;
}

.advance-btn:active {
  transform: scale(0.92);
}

.important-btn {
  background: var(--bg-primary);
  border: none;
  color: var(--accent-gold);
  font-size: 12px;
  padding: 5px 9px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: var(--nm-flat-sm);
  transition: all 0.3s var(--bounce-ease);
}

.important-btn.active {
  box-shadow: var(--nm-pressed-sm);
}

.important-btn:active {
  transform: scale(0.92);
}

.edit-btn {
  background: var(--bg-primary);
  border: none;
  color: var(--accent-blue);
  font-size: 12px;
  padding: 5px 9px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: var(--nm-flat-sm);
  transition: all 0.3s var(--bounce-ease);
}

.edit-btn:active {
  transform: scale(0.92);
}

.repeat-btn {
  background: var(--bg-primary);
  border: none;
  color: var(--accent-purple);
  font-size: 12px;
  padding: 5px 9px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: var(--nm-flat-sm);
  transition: all 0.3s var(--bounce-ease);
}

.repeat-btn.active {
  box-shadow: var(--nm-pressed-sm);
}

.repeat-btn:active {
  transform: scale(0.92);
}

.delete-item-btn {
  background: var(--bg-primary);
  border: none;
  color: var(--accent-red);
  font-size: 16px;
  cursor: pointer;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  box-shadow: var(--nm-flat-sm);
  transition: all 0.3s var(--bounce-ease);
}

.delete-item-btn:active {
  transform: scale(0.88) rotate(5deg);
  box-shadow: var(--nm-pressed-sm);
}

/* ===================================================== */
/* افزودن آیتم */
/* ===================================================== */
.add-item-row {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  flex-wrap: wrap;
  animation: slideUp 0.5s var(--bounce-ease);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.add-item-row input {
  background: var(--bg-primary);
  border: none;
  color: var(--text-primary);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 15px;
  flex: 1;
  min-width: 80px;
  font-family: var(--font-main);
  box-shadow: var(--nm-pressed-sm);
  transition: all 0.3s var(--smooth-ease);
}

.add-item-row input::placeholder {
  color: var(--text-dim);
}

.add-item-row input:focus {
  outline: none;
  transform: scale(1.01);
}

#newItemName {
  flex: 2;
}

#newItemAmount {
  flex: 1;
  min-width: 0;
}

.add-btn {
  background: var(--bg-primary);
  color: var(--accent-blue);
  border: none;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  font-family: var(--font-main);
  font-weight: 600;
  box-shadow: var(--nm-flat-sm);
  transition: all 0.3s var(--bounce-ease);
}

.add-btn:active {
  transform: scale(0.92) translateY(2px);
  box-shadow: var(--nm-pressed-sm);
}

/* ===================================================== */
/* بخش خلاصه */
/* ===================================================== */
.summary-section {
  margin-top: 28px;
  background: var(--bg-primary);
  border: none;
  border-radius: 18px;
  padding: 18px;
  box-shadow: var(--nm-flat);
  transition: all 0.5s var(--smooth-ease);
  animation: fadeIn 0.6s var(--smooth-ease);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.summary-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  font-size: 16px;
  transition: all 0.3s var(--smooth-ease);
}

.summary-row label {
  color: var(--text-muted);
  font-weight: 500;
  transition: color 0.3s var(--smooth-ease);
}

.summary-row.editable input {
  background: var(--bg-primary);
  border: none;
  color: var(--text-primary);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 15px;
  width: 130px;
  text-align: left;
  font-family: var(--font-main);
  box-shadow: var(--nm-pressed-sm);
  transition: all 0.3s var(--smooth-ease);
}

.summary-row.editable input:focus {
  outline: none;
  transform: scale(1.02);
}

.summary-value {
  font-weight: 700;
  font-size: 17px;
  color: var(--text-primary);
  transition: color 0.4s var(--smooth-ease), transform 0.3s var(--bounce-ease);
}

.summary-value.pulse {
  animation: valuePulse 0.4s var(--bounce-ease);
}

@keyframes valuePulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); color: var(--accent-green); }
  100% { transform: scale(1); }
}

.summary-value.advance-color {
  color: var(--accent-orange);
}

.summary-section hr {
  border: none;
  height: 2px;
  background: transparent;
  box-shadow: 0 1px 0 var(--shadow-light), 0 -1px 0 var(--shadow-dark);
  margin: 10px 0;
  transition: box-shadow 0.3s var(--smooth-ease);
}

.summary-row.formula {
  font-size: 14px;
  color: var(--text-muted);
}

.summary-row.formula .eq {
  color: var(--text-dim);
}

.summary-row.formula .summary-value {
  color: var(--accent-green);
}

/* ===================================================== */
/* نمودارها */
/* ===================================================== */
.charts-section {
  margin-top: 20px;
  background: var(--bg-primary);
  border: none;
  border-radius: 18px;
  padding: 18px;
  box-shadow: var(--nm-flat);
  transition: all 0.5s var(--smooth-ease);
}

.chart-container {
  margin: 10px 0;
  max-height: 200px;
  overflow: hidden;
}

.chart-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 0;
  animation: barSlide 0.6s var(--bounce-ease) forwards;
  opacity: 0;
  transform: translateX(-20px);
}

.chart-bar:nth-child(1) { animation-delay: 0.05s; }
.chart-bar:nth-child(2) { animation-delay: 0.1s; }
.chart-bar:nth-child(3) { animation-delay: 0.15s; }
.chart-bar:nth-child(4) { animation-delay: 0.2s; }
.chart-bar:nth-child(5) { animation-delay: 0.25s; }
.chart-bar:nth-child(6) { animation-delay: 0.3s; }

@keyframes barSlide {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}

.chart-bar .label {
  min-width: 60px;
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 500;
  transition: color 0.3s var(--smooth-ease);
}

.chart-bar .bar-track {
  flex: 1;
  height: 20px;
  background: var(--bg-primary);
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  box-shadow: var(--nm-pressed-sm);
  transition: background 0.3s var(--smooth-ease);
}

.chart-bar .bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-orange), var(--accent-blue));
  border-radius: 10px;
  transition: width 0.8s var(--bounce-ease);
  transform-origin: right;
}

.chart-bar .bar-value {
  min-width: 50px;
  font-size: 13px;
  text-align: left;
  color: var(--text-secondary);
  font-weight: 600;
  transition: color 0.3s var(--smooth-ease);
}

.chart-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}

.chart-stats .stat-item {
  background: var(--bg-primary);
  padding: 10px 12px;
  border-radius: 12px;
  text-align: center;
  box-shadow: var(--nm-flat-sm);
  transition: all 0.3s var(--bounce-ease);
  animation: fadeIn 0.5s var(--smooth-ease);
}

.chart-stats .stat-item:active {
  transform: scale(0.96);
}

.chart-stats .stat-item .stat-value {
  font-size: 18px;
  font-weight: 700;
  display: block;
  color: var(--text-primary);
  transition: color 0.3s var(--smooth-ease);
}

.chart-stats .stat-item .stat-label {
  font-size: 12px;
  color: var(--text-muted);
  transition: color 0.3s var(--smooth-ease);
}

/* ===================================================== */
/* مودال‌ها */
/* ===================================================== */
.modal {
  position: fixed;
  inset: 0;
  background: var(--modal-overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
  transition: background 0.4s var(--smooth-ease);
  animation: modalFade 0.3s var(--smooth-ease);
}

.modal.hidden {
  display: none;
}

@keyframes modalFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-box {
  background: var(--bg-primary);
  border: none;
  border-radius: 20px;
  width: 100%;
  max-width: 420px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 18px;
  box-shadow: var(--nm-flat);
  transition: all 0.4s var(--bounce-ease);
  animation: modalSlide 0.4s var(--bounce-ease);
}

@keyframes modalSlide {
  from { opacity: 0; transform: translateY(-30px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-box.small {
  max-width: 320px;
  text-align: center;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: none;
  box-shadow: 0 1px 0 var(--shadow-light), 0 -1px 0 var(--shadow-dark);
  color: var(--text-primary);
  transition: all 0.3s var(--smooth-ease);
}

.modal-body {
  padding: 4px 0;
}

.history-list {
  list-style: none;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 8px;
  border-bottom: 1px solid var(--border-light);
  cursor: pointer;
  transition: all 0.3s var(--bounce-ease);
}

.history-item:active {
  transform: scale(0.97);
  box-shadow: var(--nm-pressed-sm);
  border-radius: 10px;
}

.history-item .h-date {
  font-size: 15px;
  font-weight: 500;
  color: var(--text-primary);
  transition: color 0.3s var(--smooth-ease);
}

.history-item .h-info {
  font-size: 13px;

}

.toast.hide {

  to { opacity: 0; transform: translateX(-50%) translateY(30px) scale(0.9); }

<script>
// =====================================================
// کتابخانه تبدیل تاریخ شمسی
// =====================================================
function gregorianToJalali(gy, gm, gd) {
  const g_days_in_month = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  const j_days_in_month = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 29];

  function isLeap(year) {
    return ((year % 4) === 0 && (year % 100) !== 0) || (year % 400) === 0;
  }

  let gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = 0;
  for (let i = 0; i < gm - 1; i++) {
    days += g_days_in_month[i];
    if (i === 1 && isLeap(gy)) days++;
  }
  days += gd - 1;

  let jy = gy2 - 621;
  let jm = 0;
  let jd = 0;

  for (let i = 0; i < 12; i++) {
    let j_days = j_days_in_month[i];
    if (i === 11 && isLeap(jy + 621)) j_days = 30;
    if (days < j_days) {
      jm = i + 1;
      jd = days + 1;
      break;
    }
    days -= j_days;
  }

  return { year: jy, month: jm, day: jd };
}

function toPersianDate(date) {
  const j = gregorianToJalali(
    date.getFullYear(),
    date.getMonth() + 1,
    date.getDate()
  );
  const monthNames = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
  return `${j.day} ${monthNames[j.month - 1]} ${j.year}`;
}

function monthKeyToJalali(key) {
  const [y, m] = key.split('-').map(Number);
  const j = gregorianToJalali(y, m, 1);
  const monthNames = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
  return `${monthNames[j.month - 1]} ${j.year}`;
}

// =====================================================
// Helpers
// =====================================================
const toFa = (num) => {
  const n = Math.round(Number(num) || 0);
  return n.toLocaleString('fa-IR');
};

const monthKey = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;

const monthLabel = (key) => {
  if (!key) return 'نامشخص';
  
  try {
    const [y, m] = key.split('-').map(Number);
    
    if (isNaN(y) || isNaN(m) || m < 1 || m > 12) {
      return 'نامشخص';
    }
    
    const j = gregorianToJalali(y, m, 1);
    const monthNames = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
    return `${monthNames[j.month - 1]} ${j.year}`;
  } catch (e) {
    console.error('Error in monthLabel:', e);
    return 'نامشخص';
  }
};

const STORAGE_PREFIX = 'budget_month_';
const CURRENT_KEY = 'budget_current_month';
const SETTINGS_KEY = 'budget_telegram_settings';
const CHANGES_KEY = 'budget_pending_changes';
const REPEAT_KEY = 'budget_repeat_items';
const THEME_KEY = 'budget_theme';

// =====================================================
// Theme
// =====================================================
function getTheme() {
  return localStorage.getItem(THEME_KEY) || 'dark';
}

function setTheme(theme) {
  localStorage.setItem(THEME_KEY, theme);
  document.documentElement.setAttribute('data-theme', theme);
  const meta = document.getElementById('themeColorMeta');
  if (theme === 'light') {
    meta.content = '#f5f5f5';
    document.getElementById('themeToggle').textContent = '🌙';
  } else {
    meta.content = '#000000';
    document.getElementById('themeToggle').textContent = '☀️';
  }
}

function toggleTheme() {
  const current = getTheme();
  setTheme(current === 'dark' ? 'light' : 'dark');
}

// =====================================================
// State
// =====================================================
let currentMonthKey = localStorage.getItem(CURRENT_KEY) || monthKey(new Date());
let state = loadMonth(currentMonthKey);
let pendingChanges = loadPendingChanges();
let editItemId = null;
let advanceItemId = null; // برای دیالوگ دادگی

function defaultState() {
  return {
    items: [],
    totalSalary: '',
    advanceTaken: '',
    closed: false
  };
}

function loadMonth(key) {
  const raw = localStorage.getItem(STORAGE_PREFIX + key);
  return raw ? JSON.parse(raw) : defaultState();
}

function saveMonth(key, data) {
  localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(data));
}

function saveCurrentPointer(key) {
  localStorage.setItem(CURRENT_KEY, key);
}

function loadPendingChanges() {
  const raw = localStorage.getItem(CHANGES_KEY);
  return raw ? JSON.parse(raw) : { items: [], lastSubmit: null };
}

function savePendingChanges() {
  localStorage.setItem(CHANGES_KEY, JSON.stringify(pendingChanges));
}

function loadRepeatItems() {
  const raw = localStorage.getItem(REPEAT_KEY);
  return raw ? JSON.parse(raw) : [];
}

function saveRepeatItems(items) {
  localStorage.setItem(REPEAT_KEY, JSON.stringify(items));
}

function listAllMonthKeys() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith(STORAGE_PREFIX)) keys.push(k.replace(STORAGE_PREFIX, ''));
  }
  return keys.sort().reverse();
}

// =====================================================
// Telegram
// =====================================================
function getTelegramSettings() {
  const raw = localStorage.getItem(SETTINGS_KEY);
  return raw ? JSON.parse(raw) : { token: '', chatId: '' };
}

function saveTelegramSettings(token, chatId) {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify({ token, chatId }));
}

async function sendTelegramMessage(text) {
  const { token, chatId } = getTelegramSettings();
  if (!token || !chatId) {
    showToast('تنظیمات تلگرام کامل نیست!');
    return false;
  }
  try {
    const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: chatId, text })
    });
    const data = await response.json();
    if (!data.ok) {
      throw new Error(data.description || 'خطای ناشناخته');
    }
    return true;
  } catch (err) {
    console.error('Telegram send failed:', err);
    showToast('ارسال به تلگرام ناموفق بود: ' + err.message);
    return false;
  }
}

// =====================================================
// Toast
// =====================================================
function showToast(message, duration = 3000) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast show';
  clearTimeout(toast.timeout);
  toast.timeout = setTimeout(() => {
    toast.className = 'toast hide';
    setTimeout(() => {
      toast.style.display = 'none';
    }, 300);
  }, duration);
}

// =====================================================
// Calculations
// =====================================================
function calcTotals() {
  // مجموع پرداختی از کل (salaryPaid)
  const spentFromSalary = state.items.reduce((sum, i) => sum + (Number(i.salaryPaid) || 0), 0);
  
  // مجموع پرداختی از دادگی (advancePaid)
  const spentFromAdvance = state.items.reduce((sum, i) => sum + (Number(i.advancePaid) || 0), 0);
  
  const salary = Number(state.totalSalary) || 0;
  const advance = Number(state.advanceTaken) || 0;
  
  const remainingAdvance = advance - spentFromAdvance;
  const remainingSalary = salary - advance - spentFromSalary;
  
  return { 
    spentFromSalary, 
    spentFromAdvance, 
    salary, 
    advance, 
    remainingAdvance,
    remainingSalary,
    totalSpent: spentFromSalary + spentFromAdvance
  };
}

// =====================================================
// Track Changes
// =====================================================
function trackChange(type, data) {
  const now = new Date();
  pendingChanges.items.push({
    type: type,
    data: data,
    timestamp: now.toISOString(),
    persianDate: toPersianDate(now)
  });
  savePendingChanges();
}

// =====================================================
// Submit Final - بدون تاریخ در بخش تغییرات
// =====================================================
async function submitFinal() {
  if (pendingChanges.items.length === 0) {
    showToast('هیچ تغییر جدیدی برای ثبت وجود ندارد');
    return;
  }

  const { spentFromSalary, spentFromAdvance, salary, advance, remainingAdvance, remainingSalary } = calcTotals();
  
  let changesText = '📋 *تغییرات جدید:*\n';
  pendingChanges.items.forEach((change, index) => {
    let desc = '';
    if (change.type === 'partial_payment') {
      desc = `🔶 تغییر پرداخت از دادگی: ${change.data.name} (${toFa(change.data.advancePaid)} از ${toFa(change.data.total)} از دادگی، ${toFa(change.data.salaryPaid)} از کل)`;
    } else if (change.type === 'add') {
      const star = change.data.important ? ' ⭐' : '';
      desc = `➕ افزوده شد${star}: ${change.data.name} (${toFa(change.data.amount)} ریال)`;
    } else if (change.type === 'delete') {
      desc = `🗑️ حذف شد: ${change.data.name} (${toFa(change.data.amount)} ریال)`;
    } else if (change.type === 'important') {
      const status = change.data.important ? '⭐ مهم' : '🔹 عادی';
      desc = `تغییر اهمیت: ${change.data.name} → ${status}`;
    } else if (change.type === 'edit') {
      desc = `✏️ ویرایش: ${change.data.name} (${toFa(change.data.amount)} ریال)`;
    }
    changesText += `${index + 1}. ${desc}\n`;
  });

  const currentMonthName = monthLabel(currentMonthKey);
  
  const summaryText = 
    `📊 *خلاصه وضعیت مالی - ${currentMonthName}*\n\n` +
    `💰 کل: ${toFa(salary)} ریال\n` +
    `📤 دادگی: ${toFa(advance)} ریال\n` +
    `💸 خرج از کل: ${toFa(spentFromSalary)} ریال\n` +
    `🔶 خرج از دادگی: ${toFa(spentFromAdvance)} ریال\n` +
    `📈 دادگی باقی‌مانده: ${toFa(remainingAdvance)} ریال\n` +
    `🎯 مانده نهایی: ${toFa(remainingSalary)} ریال\n\n` +
    changesText;

  const success = await sendTelegramMessage(summaryText);
  
  if (success) {
    pendingChanges.items = [];
    pendingChanges.lastSubmit = new Date().toISOString();
    savePendingChanges();
    showToast('✅ ثبت نهایی با موفقیت انجام شد!');
  }
}

// =====================================================
// Render
// =====================================================
function render() {
  const title = document.getElementById('monthTitle');
  const newLabel = monthLabel(currentMonthKey);
  if (title.textContent !== newLabel) {
    title.textContent = newLabel;
    title.className = 'month-title slide-left';
    setTimeout(() => {
      title.className = 'month-title';
    }, 300);
  }

  const list = document.getElementById('itemsList');
  list.innerHTML = '';
  
  state.items.forEach(item => {
    // محاسبه وضعیت پرداخت کامل
    const totalAmount = Number(item.amount) || 0;
    const advancePaid = Number(item.advancePaid) || 0;
    const salaryPaid = Number(item.salaryPaid) || 0;
    const isPaid = (advancePaid + salaryPaid) >= totalAmount && totalAmount > 0;

    const li = document.createElement('li');
    li.className = 'item-row' + 
      (isPaid ? ' paid' : '') + 
      (item.important ? ' important' : '');

    // نمایش جزئیات پرداخت
    const detailSpan = document.createElement('span');
    detailSpan.className = 'item-detail';
    detailSpan.innerHTML = `
      <span class="advance-part">${toFa(advancePaid)}</span> / 
      <span class="salary-part">${toFa(salaryPaid)}</span>
    `;
    detailSpan.title = `از دادگی: ${toFa(advancePaid)} | از کل: ${toFa(salaryPaid)} | کل: ${toFa(totalAmount)}`;

    const name = document.createElement('span');
    name.className = 'item-name';
    name.textContent = item.name;

    const amount = document.createElement('span');
    amount.className = 'item-amount';
    amount.textContent = toFa(totalAmount);

    const actions = document.createElement('div');
    actions.className = 'item-actions';

    const advanceBtn = document.createElement('button');
    advanceBtn.className = 'advance-btn';
    advanceBtn.textContent = 'دادگی';
    advanceBtn.title = 'تعیین مبلغ از دادگی';
    advanceBtn.addEventListener('click', () => openAdvanceModal(item.id));

    const importantBtn = document.createElement('button');
    importantBtn.className = 'important-btn' + (item.important ? ' active' : '');
    importantBtn.textContent = '⭐';
    importantBtn.title = 'علامت‌گذاری به عنوان مهم';
    importantBtn.addEventListener('click', () => onToggleImportant(item.id));

    const editBtn = document.createElement('button');
    editBtn.className = 'edit-btn';
    editBtn.textContent = '✏️';
    editBtn.title = 'ویرایش';
    editBtn.addEventListener('click', () => openEditModal(item.id));

    const repeatBtn = document.createElement('button');
    repeatBtn.className = 'repeat-btn' + (item.repeat ? ' active' : '');
    repeatBtn.textContent = '🔄';
    repeatBtn.title = 'تکرار ماهانه';
    repeatBtn.addEventListener('click', () => onToggleRepeat(item.id));

    const del = document.createElement('button');
    del.className = 'delete-item-btn';
    del.textContent = '×';
    del.addEventListener('click', () => onDeleteItem(item.id));

    actions.appendChild(advanceBtn);
    actions.appendChild(importantBtn);
    actions.appendChild(editBtn);
    actions.appendChild(repeatBtn);
    actions.appendChild(del);

    li.appendChild(name);
    li.appendChild(amount);
    li.appendChild(detailSpan);
    li.appendChild(actions);
    list.appendChild(li);
  });

  document.getElementById('totalSalary').value = state.totalSalary;
  document.getElementById('advanceTaken').value = state.advanceTaken;

  const { spentFromSalary, spentFromAdvance, remainingSalary, remainingAdvance } = calcTotals();
  
  const totalSpentEl = document.getElementById('totalSpent');
  if (totalSpentEl.textContent !== toFa(spentFromSalary)) {
    totalSpentEl.textContent = toFa(spentFromSalary);
    totalSpentEl.className = 'summary-value pulse';
    setTimeout(() => { totalSpentEl.className = 'summary-value'; }, 400);
  }
  
  const advanceSpentEl = document.getElementById('advanceSpent');
  if (advanceSpentEl.textContent !== toFa(spentFromAdvance)) {
    advanceSpentEl.textContent = toFa(spentFromAdvance);
    advanceSpentEl.className = 'summary-value advance-color pulse';
    setTimeout(() => { advanceSpentEl.className = 'summary-value advance-color'; }, 400);
  }
  
  document.getElementById('remainingSalary').textContent = toFa(remainingSalary);
  document.getElementById('finalLeft').textContent = toFa(remainingAdvance);

  saveMonth(currentMonthKey, state);
}

// دیالوگ دادگی
function openAdvanceModal(id) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  
  advanceItemId = id;
  const total = Number(item.amount) || 0;
  const currentAdvance = Number(item.advancePaid) || 0;
  
  document.getElementById('advanceItemName').textContent = `💰 ${item.name} (${toFa(total)} ریال)`;
  document.getElementById('advanceSlider').max = total;
  document.getElementById('advanceSlider').value = currentAdvance;
  document.getElementById('advanceInput').value = currentAdvance;
  document.getElementById('advanceMaxLabel').textContent = toFa(total);
  document.getElementById('advanceRemainingLabel').textContent = toFa(total - currentAdvance);
  
  document.getElementById('advanceModal').classList.remove('hidden');
  
  // اتصال رویدادها
  const slider = document.getElementById('advanceSlider');
  const input = document.getElementById('advanceInput');
  const remainingLabel = document.getElementById('advanceRemainingLabel');
  
  function updateAdvance(value) {
    let val = Math.min(Math.max(0, Number(value) || 0), total);
    slider.value = val;
    input.value = val;
    remainingLabel.textContent = toFa(total - val);
  }
  
  slider.oninput = function() {
    updateAdvance(this.value);
  };
  
  input.oninput = function() {
    let val = Math.min(Math.max(0, Number(this.value) || 0), total);
    updateAdvance(val);
  };
  
  // دکمه تأیید
  document.getElementById('advanceConfirmBtn').onclick = function() {
    const newAdvance = Math.min(Math.max(0, Number(input.value) || 0), total);
    const newSalary = total - newAdvance;
    
    if (newAdvance === currentAdvance) {
      showToast('مقدار تغییر نکرد');
      document.getElementById('advanceModal').classList.add('hidden');
      return;
    }
    
    item.advancePaid = newAdvance;
    item.salaryPaid = newSalary;
    
    trackChange('partial_payment', {
      id: item.id,
      name: item.name,
      total: total,
      advancePaid: newAdvance,
      salaryPaid: newSalary
    });
    
    document.getElementById('advanceModal').classList.add('hidden');
    render();
    showToast(`💰 ${item.name}: ${toFa(newAdvance)} از دادگی، ${toFa(newSalary)} از کل`);
  };
}

// بستن دیالوگ دادگی
document.getElementById('closeAdvanceBtn').addEventListener('click', () => {
  document.getElementById('advanceModal').classList.add('hidden');
});

// کلیک بیرون مودال برای بستن
document.getElementById('advanceModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) {
    document.getElementById('advanceModal').classList.add('hidden');
  }
});

function onToggleImportant(id) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  
  item.important = !item.important;
  
  trackChange('important', {
    id: item.id,
    name: item.name,
    important: item.important
  });
  
  render();
  showToast(item.important ? '⭐ مهم شد' : '🔹 عادی شد');
}

function onToggleRepeat(id) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  
  item.repeat = !item.repeat;
  
  const repeatItems = loadRepeatItems();
  if (item.repeat) {
    repeatItems.push({ name: item.name, amount: item.amount });
  } else {
    const index = repeatItems.findIndex(r => r.name === item.name && r.amount === item.amount);
    if (index > -1) repeatItems.splice(index, 1);
  }
  saveRepeatItems(repeatItems);
  
  render();
  showToast(item.repeat ? '🔄 به لیست تکراری‌ها اضافه شد' : 'از لیست تکراری‌ها حذف شد');
}

function onDeleteItem(id) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  
  // اضافه کردن کلاس removing برای انیمیشن حذف
  const items = document.querySelectorAll('.item-row');
  let targetEl = null;
  items.forEach(el => {
    if (el.querySelector('.item-name')?.textContent === item.name) {
      targetEl = el;
    }
  });
  
  if (targetEl) {
    targetEl.className = 'item-row removing';
    setTimeout(() => {
      trackChange('delete', {
        id: item.id,
        name: item.name,
        amount: item.amount
      });
      
      state.items = state.items.filter(i => i.id !== id);
      render();
      showToast(`آیتم "${item.name}" حذف شد`);
    }, 350);
  } else {
    trackChange('delete', {
      id: item.id,
      name: item.name,
      amount: item.amount
    });
    
    state.items = state.items.filter(i => i.id !== id);
    render();
    showToast(`آیتم "${item.name}" حذف شد`);
  }
}

function onAddItem() {
  const nameInput = document.getElementById('newItemName');
  const amountInput = document.getElementById('newItemAmount');
  const name = nameInput.value.trim();
  const amount = amountInput.value.trim();
  if (!name || !amount) {
    showToast('لطفاً نام و مبلغ را وارد کنید');
    return;
  }

  const total = Number(amount);
  if (total <= 0) {
    showToast('مبلغ باید بزرگتر از صفر باشد');
    return;
  }

  const newItem = {
    id: Date.now().toString(),
    name,
    amount: total,
    advancePaid: 0,
    salaryPaid: 0,
    important: false,
    repeat: false
  };

  trackChange('add', {
    id: newItem.id,
    name: newItem.name,
    amount: newItem.amount,
    important: newItem.important
  });

  state.items.push(newItem);
  nameInput.value = '';
  amountInput.value = '';
  render();
  showToast(`آیتم "${name}" اضافه شد`);
}

function openEditModal(id) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  
  editItemId = id;
  document.getElementById('editName').value = item.name;
  document.getElementById('editAmount').value = item.amount;
  document.getElementById('editModal').classList.remove('hidden');
}

function saveEdit() {
  if (!editItemId) return;
  
  const item = state.items.find(i => i.id === editItemId);
  if (!item) return;
  
  const newName = document.getElementById('editName').value.trim();
  const newAmount = document.getElementById('editAmount').value.trim();
  
  if (!newName || !newAmount) {
    showToast('لطفاً نام و مبلغ را وارد کنید');
    return;
  }
  
  const total = Number(newAmount);
  if (total <= 0) {
    showToast('مبلغ باید بزرگتر از صفر باشد');
    return;
  }
  
  // اگر مبلغ تغییر کرد، پرداخت‌ها رو ریست کن (چون دیگه منطقی نیست)
  const oldTotal = Number(item.amount) || 0;
  trackChange('edit', {
    id: item.id,
    name: newName,
    amount: total,
    oldAmount: oldTotal
  });
  
  item.name = newName;
  item.amount = total;
  // در صورت تغییر مبلغ، پرداخت‌های قبلی رو نگه دار اما اگر از مبلغ جدید بیشتر شد، اصلاح کن
  if (item.advancePaid > total) item.advancePaid = total;
  if (item.salaryPaid > total - item.advancePaid) item.salaryPaid = total - item.advancePaid;
  
  document.getElementById('editModal').classList.add('hidden');
  render();
  showToast('آیتم ویرایش شد');
}

function switchToMonth(key) {
  if (pendingChanges.items.length > 0) {
    showToast('ابتدا تغییرات را با دکمه "ثبت نهایی" ارسال کنید!');
    return;
  }
  
  currentMonthKey = key;
  state = loadMonth(key);
  saveCurrentPointer(key);
  render();
}

function shiftMonth(delta) {
  if (pendingChanges.items.length > 0) {
    showToast('ابتدا تغییرات را با دکمه "ثبت نهایی" ارسال کنید!');
    return;
  }
  
  const [y, m] = currentMonthKey.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  const newKey = monthKey(d);
  
  const title = document.getElementById('monthTitle');
  title.className = 'month-title ' + (delta > 0 ? 'slide-left' : 'slide-right');
  
  setTimeout(() => {
    switchToMonth(newKey);
    title.className = 'month-title';
  }, 250);
}

function startNewMonth() {
  if (pendingChanges.items.length > 0) {
    showToast('ابتدا تغییرات را با دکمه "ثبت نهایی" ارسال کنید!');
    return;
  }

  const repeatItems = loadRepeatItems();
  repeatItems.forEach(item => {
    state.items.push({
      id: Date.now().toString() + '_' + Math.random().toString(36).substr(2, 4),
      name: item.name,
      amount: Number(item.amount),
      advancePaid: 0,
      salaryPaid: 0,
      important: false,
      repeat: true
    });
  });

  const { spentFromSalary, spentFromAdvance, salary, advance, remainingAdvance, remainingSalary } = calcTotals();
  
  const currentMonthName = monthLabel(currentMonthKey);
  
  const summary =
    `📅 *خلاصه ماه ${currentMonthName}*\n\n` +
    `💰 کل: ${toFa(salary)} ریال\n` +
    `📤 دادگی: ${toFa(advance)} ریال\n` +
    `💸 خرج از کل: ${toFa(spentFromSalary)} ریال\n` +
    `🔶 خرج از دادگی: ${toFa(spentFromAdvance)} ریال\n` +
    `📈 دادگی باقی‌مانده: ${toFa(remainingAdvance)} ریال\n` +
    `🎯 مانده نهایی: ${toFa(remainingSalary)} ریال`;
  sendTelegramMessage(summary);

  state.closed = true;
  saveMonth(currentMonthKey, state);

  const [y, m] = currentMonthKey.split('-').map(Number);
  const nextDate = new Date(y, m, 1);
  const nextKey = monthKey(nextDate);
  currentMonthKey = nextKey;
  state = defaultState();
  saveCurrentPointer(nextKey);
  render();
  showToast('ماه جدید شروع شد');
}

// =====================================================
// History
// =====================================================
function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  const keys = listAllMonthKeys();

  if (keys.length === 0) {
    list.innerHTML = '<li class="history-item"><span class="h-info">هنوز ماهی ثبت نشده</span></li>';
    return;
  }

  keys.forEach(key => {
    const data = loadMonth(key);
    const spentFromSalary = data.items.reduce((s, i) => s + (Number(i.salaryPaid) || 0), 0);
    const spentFromAdvance = data.items.reduce((s, i) => s + (Number(i.advancePaid) || 0), 0);
    const totalItems = data.items.length;

    const li = document.createElement('li');
    li.className = 'history-item';

    const left = document.createElement('span');
    left.className = 'h-date';
    left.textContent = monthLabel(key);

    const right = document.createElement('span');
    right.className = 'h-info';
    right.textContent = `کل: ${toFa(spentFromSalary)} | دادگی: ${toFa(spentFromAdvance)} | ${totalItems} آیتم`;

    li.appendChild(left);
    li.appendChild(right);
    li.addEventListener('click', () => {
      switchToMonth(key);
      document.getElementById('historyModal').classList.add('hidden');
    });
    list.appendChild(li);
  });
}

// Charts
// =====================================================
function renderCharts() {
  const stats = document.getElementById('chartStats');
  const container = document.getElementById('chartContainer');
  
  const allKeys = listAllMonthKeys().slice(0, 6);
  const currentData = calcTotals();
  
  stats.innerHTML = `
    <div class="stat-item">
      <span class="stat-value">${toFa(currentData.totalSpent)}</span>
      <span class="stat-label">جمع کل خرج</span>
    </div>
    <div class="stat-item">
      <span class="stat-value">${toFa(currentData.remainingSalary)}</span>
      <span class="stat-label">باقی‌مانده نهایی</span>
    </div>
    <div class="stat-item">
      <span class="stat-value">${state.items.length}</span>
      <span class="stat-label">تعداد آیتم‌ها</span>
    </div>
    <div class="stat-item">
      <span class="stat-value">${toFa(currentData.advance)}</span>
      <span class="stat-label">دادگی کل</span>
    </div>
  `;
  
  let chartHTML = '<div style="margin-top:16px;"><div style="font-size:14px;color:var(--text-muted);margin-bottom:8px;">مقایسه خرج ماه‌های اخیر:</div>';
  
  const maxSpent = Math.max(...allKeys.map(k => {
    const data = loadMonth(k);
    return data.items.reduce((s, i) => s + (Number(i.salaryPaid) || 0) + (Number(i.advancePaid) || 0), 0);
  }), 1);
  
  allKeys.slice(0, 6).forEach(key => {
    const data = loadMonth(key);
    const spent = data.items.reduce((s, i) => s + (Number(i.salaryPaid) || 0) + (Number(i.advancePaid) || 0), 0);
    const percentage = Math.max((spent / maxSpent) * 100, 5);
    
    chartHTML += `
      <div class="chart-bar">
        <span class="label">${monthLabel(key)}</span>
        <div class="bar-track">
          <div class="bar-fill" style="width:${percentage}%;"></div>
        </div>
        <span class="bar-value">${toFa(spent)}</span>
      </div>
    `;
  });
  
  chartHTML += '</div>';
  container.innerHTML = chartHTML;
}

// =====================================================
// Backup
// =====================================================
function exportBackup() {
  const data = {
    version: '2.0',
    exportDate: new Date().toISOString(),
    months: {},
    settings: getTelegramSettings(),
    repeatItems: loadRepeatItems()
  };
  
  const keys = listAllMonthKeys();
  keys.forEach(key => {
    data.months[key] = loadMonth(key);
  });
  
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `budget_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  
  document.getElementById('backupStatus').textContent = '✅ خروجی گرفته شد';
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      
      if (!data.months || typeof data.months !== 'object') {
        throw new Error('فرمت فایل نامعتبر است');
      }
      
      Object.keys(data.months).forEach(key => {
        // برای سازگاری با نسخه قبلی، آیتم‌های قدیمی رو به ساختار جدید تبدیل کن
        const monthData = data.months[key];
        if (monthData.items) {
          monthData.items = monthData.items.map(item => {
            // اگر advancePaid و salaryPaid وجود نداره، از isAdvance استفاده کن
            if (item.advancePaid === undefined && item.salaryPaid === undefined) {
              const total = Number(item.amount) || 0;
              if (item.isAdvance) {
                return { ...item, advancePaid: total, salaryPaid: 0 };
              } else if (item.checked) {
                return { ...item, advancePaid: 0, salaryPaid: total };
              } else {
                return { ...item, advancePaid: 0, salaryPaid: 0 };
              }
            }
            return item;
          });
          // حذف فیلدهای قدیمی
          monthData.items = monthData.items.map(({ isAdvance, checked, ...rest }) => rest);
        }
        saveMonth(key, monthData);
      });
      
      if (data.settings) {
        saveTelegramSettings(data.settings.token || '', data.settings.chatId || '');
      }
      
      if (data.repeatItems) {
        saveRepeatItems(data.repeatItems);
      }
      
      switchToMonth(currentMonthKey);
      document.getElementById('backupStatus').textContent = '✅ بازیابی با موفقیت انجام شد';
      showToast('✅ اطلاعات با موفقیت بازیابی شد');
    } catch (err) {
      document.getElementById('backupStatus').textContent = '❌ خطا: ' + err.message;
      showToast('❌ خطا در بازیابی: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// =====================================================
// PWA
// =====================================================
function registerSW() {
  if ('serviceWorker' in navigator) {
    console.log('PWA ready');
  }
}

// =====================================================
// Wiring
// =====================================================

// Theme
setTheme(getTheme());
document.getElementById('themeToggle').addEventListener('click', toggleTheme);

document.getElementById('addItemBtn').addEventListener('click', onAddItem);
document.getElementById('newItemAmount').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') onAddItem();
});

document.getElementById('totalSalary').addEventListener('input', (e) => {
  state.totalSalary = e.target.value;
  render();
});
document.getElementById('advanceTaken').addEventListener('input', (e) => {
  state.advanceTaken = e.target.value;
  render();
});

document.getElementById('prevMonthBtn').addEventListener('click', () => shiftMonth(-1));
document.getElementById('nextMonthBtn').addEventListener('click', () => shiftMonth(1));

document.getElementById('historyBtn').addEventListener('click', () => {
  renderHistory();
  document.getElementById('historyModal').classList.remove('hidden');
});
document.getElementById('closeHistoryBtn').addEventListener('click', () => {
  document.getElementById('historyModal').classList.add('hidden');
});

document.getElementById('chartBtn').addEventListener('click', () => {
  renderCharts();
  document.getElementById('chartModal').classList.remove('hidden');
});
document.getElementById('closeChartBtn').addEventListener('click', () => {
  document.getElementById('chartModal').classList.add('hidden');
});

document.getElementById('backupBtn').addEventListener('click', () => {
  document.getElementById('backupStatus').textContent = '';
  document.getElementById('backupModal').classList.remove('hidden');
});
document.getElementById('closeBackupBtn').addEventListener('click', () => {
  document.getElementById('backupModal').classList.add('hidden');
});
document.getElementById('exportBtn').addEventListener('click', exportBackup);
document.getElementById('importFile').addEventListener('change', (e) => {
  if (e.target.files.length > 0) {
    importBackup(e.target.files[0]);
  }
  e.target.value = '';
});

document.getElementById('submitFinalBtn').addEventListener('click', submitFinal);

document.getElementById('newMonthBtn').addEventListener('click', () => {
  if (pendingChanges.items.length > 0) {
    showToast('ابتدا تغییرات را با دکمه "ثبت نهایی" ارسال کنید!');
    return;
  }
  document.getElementById('confirmText').textContent =
    'شروع ماه جدید یعنی خلاصه ماه فعلی به تلگرام فرستاده میشه و یه لیست خالی جدید باز میشه. ادامه بدم؟';
  document.getElementById('confirmModal').classList.remove('hidden');
});

document.getElementById('confirmYes').addEventListener('click', () => {
  document.getElementById('confirmModal').classList.add('hidden');
  startNewMonth();
});
document.getElementById('confirmNo').addEventListener('click', () => {
  document.getElementById('confirmModal').classList.add('hidden');
});

document.getElementById('settingsBtn').addEventListener('click', () => {
  const { token, chatId } = getTelegramSettings();
  const repeatItems = loadRepeatItems();
  document.getElementById('botToken').value = token;
  document.getElementById('chatId').value = chatId;
  document.getElementById('repeatItems').value = repeatItems.map(i => `${i.name},${i.amount}`).join('\n');
  document.getElementById('settingsStatus').textContent = '';
  document.getElementById('settingsModal').classList.remove('hidden');
});
document.getElementById('closeSettingsBtn').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.add('hidden');
});
document.getElementById('saveSettingsBtn').addEventListener('click', () => {
  const token = document.getElementById('botToken').value.trim();
  const chatId = document.getElementById('chatId').value.trim();
  const repeatText = document.getElementById('repeatItems').value.trim();
  
  saveTelegramSettings(token, chatId);
  
  const repeatItems = repeatText.split('\n')
    .filter(line => line.trim())
    .map(line => {
      const [name, amount] = line.split(',').map(s => s.trim());
      return { name, amount: Number(amount) || 0 };
    })
    .filter(item => item.name && item.amount > 0);
  saveRepeatItems(repeatItems);
  
  document.getElementById('settingsStatus').textContent = '✅ ذخیره شد';
  showToast('تنظیمات ذخیره شد');
});

document.getElementById('closeEditBtn').addEventListener('click', () => {
  document.getElementById('editModal').classList.add('hidden');
});
document.getElementById('saveEditBtn').addEventListener('click', saveEdit);
document.getElementById('editAmount').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') saveEdit();
});

// بستن مودال‌ها با کلیک بیرون
document.querySelectorAll('.modal').forEach(modal => {
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      modal.classList.add('hidden');
    }
  });
});

// =====================================================
// Init
// =====================================================
render();
registerSW();
console.log('تغییرات ثبت نشده:', pendingChanges.items.length);
console.log('آیتم‌های تکراری:', loadRepeatItems().length);
</script>
</body>
  </html>
