<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ورود مدیریت | پیتزا گیتی</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --char:#120e0a;
    --ember:#f2b705;
    --flame:#d94f04;
    --deep-red:#8a1c0f;
    --smoke:#efe6d8;
    --smoke-dim:#b8ab97;
    --line:#3a2f24;
    --ticket:#1a140f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:
      radial-gradient(ellipse 90% 55% at 50% 0%, rgba(217,79,4,0.2), transparent 60%),
      var(--char);
    color:var(--smoke);
    font-family:'Vazirmatn',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .box{
    width:100%;
    max-width:400px;
    background:var(--ticket);
    border:1px solid var(--line);
    border-radius:6px;
    padding:34px 26px;
    text-align:center;
  }
  .brand{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:32px;
    color:var(--ember);
  }
  .brand .fa{color:var(--flame);}
  .sub{
    color:var(--smoke-dim);
    font-size:13px;
    margin-top:8px;
    margin-bottom:28px;
    line-height:1.9;
  }
  label{
    display:block;
    text-align:right;
    font-size:12.5px;
    color:var(--smoke-dim);
    margin-bottom:6px;
  }
  input{
    width:100%;
    background:var(--char);
    border:1px solid var(--line);
    border-radius:6px;
    padding:13px 14px;
    color:var(--smoke);
    font-family:'Vazirmatn',sans-serif;
    font-size:15px;
    margin-bottom:14px;
    outline:none;
    transition:border-color .15s;
  }
  input:focus{border-color:var(--flame);}
  button{
    width:100%;
    background:linear-gradient(135deg, var(--flame), var(--deep-red));
    color:var(--smoke);
    border:none;
    border-radius:6px;
    padding:14px;
    font-family:'Vazirmatn',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    margin-top:4px;
    transition:transform .12s, opacity .12s;
  }
  button:active{transform:scale(0.98);}
  button:disabled{opacity:0.55; cursor:default;}
  .error{
    color:#ff8163;
    font-size:12.5px;
    margin-top:13px;
    min-height:15px;
  }
  .back{
    display:inline-block;
    margin-top:20px;
    color:#5c5148;
    font-size:12px;
    text-decoration:none;
  }
  .link-box{
    margin-top:18px;
    background:var(--char);
    border:1px solid rgba(242,183,5,0.3);
    border-radius:6px;
    padding:14px;
    display:none;
  }
  .link-box.show{display:block;}
  .link-box p{
    font-size:11.5px;
    color:var(--smoke-dim);
    margin-bottom:8px;
    line-height:1.8;
    text-align:right;
  }
  .link-box .url{
    font-size:10.5px;
    color:var(--ember);
    word-break:break-all;
    text-align:left;
    direction:ltr;
    background:rgba(242,183,5,0.06);
    padding:8px 10px;
    border-radius:5px;
    margin-bottom:8px;
  }
  .copy-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--smoke);
    font-size:12px;
    padding:9px;
    border-radius:6px;
  }
</style>
</head>
<body>

<div class="box" id="box">
  <div class="brand">پیتزا<span class="fa"> گیتی</span></div>
  <div class="sub">ورود به پنل مدیریت منو</div>
  <div id="formArea">
    <label for="pass">رمز عبور</label>
    <input type="password" id="pass" placeholder="رمز عبور را وارد کنید" autocomplete="current-password">
    <button id="submitBtn">ورود</button>
    <div class="error" id="errMsg"></div>
  </div>
  <a class="back" href="index.html">بازگشت به منو</a>
</div>

<script>
const SUPABASE_URL = "https://rwfliawxhoyozdcgpipb.supabase.co";
const SUPABASE_KEY = "sb_publishable_6WEiBx96Ye0AAEmjkI6azw_rMJI46ac";
const SUPABASE_TABLE = "menu_data";
const SUPABASE_ROW_ID = 1;

document.getElementById('pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('submitBtn').addEventListener('click', doLogin);
document.getElementById('pass').focus();

async function doLogin(){
  const pass = document.getElementById('pass').value;
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errMsg');
  if(!pass){ err.textContent = 'رمز عبور را وارد کن'; return; }

  btn.disabled = true;
  btn.textContent = 'در حال بررسی...';
  err.textContent = '';

  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.${SUPABASE_ROW_ID}&select=password`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    if(!res.ok) throw new Error('fetch-fail');
    const rows = await res.json();
    if(rows && rows[0] && rows[0].password === pass){
      sessionStorage.setItem('gheiti_admin_auth', 'true');
      window.location.href = 'gheiti-menu-admin.html';
    } else {
      err.textContent = 'رمز عبور اشتباه است';
      btn.disabled = false;
      btn.textContent = 'ورود';
    }
  }catch(e){
    err.textContent = 'خطا در اتصال به سرور. دوباره تلاش کن.';
    btn.disabled = false;
    btn.textContent = 'ورود';
  }
}
</script>

</body>
</html>
