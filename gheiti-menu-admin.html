<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>پنل مدیریت | پیتزا گیتی</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --char:#120e0a;
    --ember:#f2b705;
    --flame:#d94f04;
    --deep-red:#8a1c0f;
    --green:#3fae62;
    --smoke:#efe6d8;
    --smoke-dim:#b8ab97;
    --line:#3a2f24;
    --ticket:#1a140f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--char);
    color:var(--smoke);
    font-family:'Vazirmatn',sans-serif;
    min-height:100vh;
    padding-bottom:100px;
  }
  header{
    position:sticky; top:0; z-index:30;
    background:rgba(18,14,10,0.96);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:15px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .h-brand{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:20px;
    color:var(--ember);
  }
  .h-brand span{color:var(--flame);}
  .h-actions{display:flex; gap:8px;}
  .icon-btn{
    background:var(--ticket);
    border:1px solid var(--line);
    color:var(--smoke-dim);
    border-radius:6px;
    padding:8px 12px;
    font-size:12px;
    font-family:'Vazirmatn',sans-serif;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
  }

  .status-bar{max-width:700px; margin:14px auto 0; padding:0 16px;}
  .status{
    font-size:12.5px;
    padding:10px 14px;
    border-radius:6px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .status.ok{background:rgba(63,174,98,0.1); border:1px solid rgba(63,174,98,0.3); color:var(--green);}
  .status.err{background:rgba(138,28,15,0.15); border:1px solid rgba(217,79,4,0.35); color:#ff8163;}
  .status.info{background:rgba(242,183,5,0.07); border:1px solid rgba(242,183,5,0.25); color:var(--ember);}

  .wrap{max-width:700px; margin:0 auto; padding:20px 16px;}

  .search-wrap{position:relative; margin-bottom:18px;}
  .search-input{
    width:100%;
    background:var(--ticket);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 44px 14px 16px;
    color:var(--smoke);
    font-family:'Vazirmatn',sans-serif;
    font-size:14px;
    outline:none;
    transition:border-color .15s;
  }
  .search-input:focus{border-color:var(--flame);}
  .search-icon{position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--smoke-dim); font-size:15px; pointer-events:none;}
  .search-clear{position:absolute; left:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--smoke-dim); font-size:15px; cursor:pointer; display:none;}
  .search-clear.show{display:block;}
  .search-count{font-size:11.5px; color:var(--smoke-dim); margin-top:8px; padding:0 4px;}
  .no-results{text-align:center; padding:40px 20px; color:var(--smoke-dim); font-size:13px;}

  .settings-block{
    background:var(--ticket);
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px;
    margin-bottom:20px;
  }
  .toggle-settings{display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .settings-title{font-family:'Baloo 2', sans-serif; font-weight:700; font-size:17px; color:var(--ember);}
  .settings-body{display:none; margin-top:14px;}
  .settings-body.show{display:block;}
  .settings-block input{
    width:100%;
    background:var(--char);
    border:1px solid var(--line);
    border-radius:5px;
    padding:10px 12px;
    color:var(--smoke);
    font-family:'Vazirmatn',sans-serif;
    font-size:13px;
    outline:none;
    margin-bottom:8px;
  }
  .settings-block input:focus{border-color:var(--flame);}
  .settings-btn{
    background:linear-gradient(135deg, var(--flame), var(--deep-red));
    color:var(--smoke);
    border:none;
    border-radius:5px;
    padding:10px 16px;
    font-family:'Vazirmatn',sans-serif;
    font-weight:700;
    font-size:12.5px;
    cursor:pointer;
  }
  .settings-msg{font-size:11.5px; margin-top:8px;}
  .settings-msg.ok{color:var(--green);}
  .settings-msg.err{color:#ff8163;}
  .field-label{font-size:11px; color:var(--smoke-dim); margin-bottom:5px; display:block;}
  .code-box{
    background:var(--char);
    border:1px solid rgba(242,183,5,0.22);
    border-radius:5px;
    padding:10px 12px;
    font-size:10.5px;
    color:var(--ember);
    word-break:break-all;
    direction:ltr;
    text-align:left;
    margin-bottom:8px;
  }

  .cat-block{
    background:var(--ticket);
    border:1px solid var(--line);
    border-radius:6px;
    margin-bottom:18px;
    overflow:hidden;
  }
  .cat-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    background:rgba(242,183,5,0.03);
  }
  .cat-title-input{
    background:transparent;
    border:none;
    color:var(--ember);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:18px;
    outline:none;
    width:100%;
  }
  .cat-del{background:none; border:none; color:#5c5148; font-size:17px; cursor:pointer; padding:4px 8px;}

  .item-row{padding:14px 16px; border-bottom:1px solid var(--line);}
  .item-row:last-child{border-bottom:none;}
  .field-group{margin-bottom:10px;}
  input[type=text], textarea{
    width:100%;
    background:var(--char);
    border:1px solid var(--line);
    border-radius:5px;
    padding:10px 12px;
    color:var(--smoke);
    font-family:'Vazirmatn',sans-serif;
    font-size:13px;
    outline:none;
    transition:border-color .15s;
  }
  input[type=text]:focus, textarea:focus{border-color:var(--flame);}
  textarea{resize:vertical; min-height:44px;}

  .price-grid{display:grid; grid-template-columns:1fr 1fr auto; gap:6px; margin-bottom:6px; align-items:center;}
  .price-grid input{font-size:12.5px; padding:8px 10px;}
  .mini-btn{background:none; border:1px solid var(--line); color:#5c5148; border-radius:5px; width:32px; height:32px; font-size:14px; cursor:pointer; flex-shrink:0;}
  .add-price-btn{font-size:11.5px; color:var(--flame); background:none; border:1px dashed rgba(217,79,4,0.4); border-radius:5px; padding:7px 12px; cursor:pointer; margin-top:4px;}
  .single-price-toggle{display:flex; gap:8px; margin-bottom:10px;}
  .toggle-btn{flex:1; padding:8px; border-radius:5px; border:1px solid var(--line); background:var(--char); color:var(--smoke-dim); font-size:11.5px; font-family:'Vazirmatn',sans-serif; cursor:pointer;}
  .toggle-btn.active{border-color:var(--ember); color:var(--ember); background:rgba(242,183,5,0.06);}

  .item-row-actions{display:flex; justify-content:space-between; align-items:center; margin-top:10px;}
  .del-item-btn{background:none; border:none; color:#a85246; font-size:11.5px; cursor:pointer;}
  .tag-input-wrap{display:flex; align-items:center; gap:8px;}
  .tag-input-wrap input{width:100px;}
  .add-item-btn{width:100%; padding:13px; background:none; border:none; color:var(--flame); font-size:13px; font-weight:600; cursor:pointer;}
  .add-cat-btn{width:100%; padding:15px; background:var(--ticket); border:1px dashed var(--line); border-radius:6px; color:var(--smoke-dim); font-size:13.5px; font-weight:600; cursor:pointer; margin-bottom:20px;}

    position:fixed; bottom:0; left:0; right:0;

    backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    padding:14px 16px;
    display:flex; gap:10px;

    flex:1;
    background:linear-gradient(135deg, var(--flame), var(--deep-red));
    color:var(--smoke);
    border:none;
    border-radius:6px;
    padding:15px;
    font-family:'Vazirmatn',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
  }
  .save-btn:disabled{opacity:0.6;}

  .setup-screen{max-width:480px; margin:60px auto; padding:0 20px; text-align:center;}

  .setup-screen p{color:var(--smoke-dim); font-size:13px; line-height:2; margin-bottom:20px;}
  .setup-screen button{
    background:linear-gradient(135deg, var(--flame), var(--deep-red));
    color:var(--smoke);
    border:none;
    border-radius:6px;
    padding:14px 24px;
    font-family:'Vazirmatn',sans-serif;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;

</head>

};

function escapeHtml(str){ const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
function escapeAttr(str){ return String(str).replace(/'/g, "\\'"); }

function toman(n){ return Number(n).toLocaleString('fa-IR'); }

// ---------- Auth ----------
function checkAuth(){
  if(sessionStorage.getItem('gheiti_admin_auth') !== 'true'){
    document.getElementById('authGate').innerHTML = `
      <div class="setup-screen">
        <h2>ورود لازم است</h2>
        <p>برای ادامه، رمز عبور پنل مدیریت را وارد کن.</p>
        <button onclick="window.location.href='gheiti-menu-login.html'">وارد شدن با رمز عبور</button>
      </div>`;
    return false;
  }
  return true;
}

function logout(){
  sessionStorage.removeItem('gheiti_admin_auth');
  window.location.href = 'gheiti-menu-login.html';
}

function showStatus(type, msg, autoHide){
  const bar = document.getElementById('statusBar');
  bar.innerHTML = `<div class="status ${type}">${msg}</div>`;
  if(autoHide){ setTimeout(()=>{ bar.innerHTML=''; }, 2600); }
}

async function initApp(){
  document.getElementById('authGate').innerHTML = '';
  document.getElementById('appRoot').style.display = 'block';
  document.getElementById('saveBar').style.display = 'flex';
  showStatus('info', 'در حال بارگذاری منو...');

  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.${SUPABASE_ROW_ID}&select=*`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    if(!res.ok) throw new Error('fetch-fail');
    const rows = await res.json();
    if(rows && rows[0]){
      storedRecord = rows[0];
      menuData = (storedRecord.data && storedRecord.data.categories) ? storedRecord.data : JSON.parse(JSON.stringify(FALLBACK_DATA));
    } else {
      storedRecord = { id: SUPABASE_ROW_ID, password: null, data: JSON.parse(JSON.stringify(FALLBACK_DATA)) };
      menuData = storedRecord.data;
    }
    document.getElementById('statusBar').innerHTML = '';
    renderCategories();
  }catch(e){
    showStatus('err', 'بارگذاری از سرور ناموفق بود. نسخه پیش‌فرض نمایش داده شد — با ذخیره، اطلاعات فعلی جایگزین می‌شود.');
    storedRecord = { id: SUPABASE_ROW_ID, password: null, data: JSON.parse(JSON.stringify(FALLBACK_DATA)) };
    menuData = storedRecord.data;
    renderCategories();
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('searchInput');
  if(input){
    input.addEventListener('input', () => {
      currentSearch = input.value.trim();
      document.getElementById('searchClear').classList.toggle('show', currentSearch.length>0);
      renderCategories();
    });
  }
});

function clearSearch(){
  currentSearch = "";
  document.getElementById('searchInput').value = "";
  document.getElementById('searchClear').classList.remove('show');
  renderCategories();
}

function toggleSettings(){
  const body = document.getElementById('settingsBody');
  const arrow = document.getElementById('settingsArrow');
  body.classList.toggle('show');
  arrow.textContent = body.classList.contains('show') ? '▴' : '▾';
}

async function changePassword(){
  const cur = document.getElementById('curPass').value;
  const p1 = document.getElementById('newPass1').value;
  const p2 = document.getElementById('newPass2').value;
  const msg = document.getElementById('passMsg');

  if(storedRecord.password && cur !== storedRecord.password){
    msg.className = 'settings-msg err'; msg.textContent = 'رمز فعلی اشتباه است'; return;
  }
  if(!p1 || p1.length < 4){
    msg.className = 'settings-msg err'; msg.textContent = 'رمز جدید باید حداقل ۴ کاراکتر باشد'; return;
  }
  if(p1 !== p2){
    msg.className = 'settings-msg err'; msg.textContent = 'رمزهای جدید یکسان نیستند'; return;
  }

  storedRecord.password = p1;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.${SUPABASE_ROW_ID}`, {
      method:'PATCH',
      headers:{
        'Content-Type':'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ password: p1 })
    });
    if(!res.ok) throw new Error('save-fail');
    msg.className = 'settings-msg ok'; msg.textContent = '✓ رمز عبور با موفقیت تغییر کرد';
    document.getElementById('curPass').value = '';
    document.getElementById('newPass1').value = '';
    document.getElementById('newPass2').value = '';
  }catch(e){
    msg.className = 'settings-msg err'; msg.textContent = 'خطا در ذخیره رمز جدید. دوباره تلاش کن.';
  }
}

function itemMatchesSearch(item, query){
  if(!query) return true;
  const q = query.toLowerCase();
  return (item.name && item.name.toLowerCase().includes(q)) || (item.desc && item.desc.toLowerCase().includes(q));
}

function renderCategories(){
  const wrap = document.getElementById('catsWrap');
  const addCatWrap = document.getElementById('addCatWrap');
  wrap.innerHTML = '';

  let totalMatches = 0;
  const isSearching = currentSearch.length > 0;

  menuData.categories.forEach((cat, ci) => {
    let visibleIndexes = [];
    cat.items.forEach((item, ii) => { if(itemMatchesSearch(item, currentSearch)) visibleIndexes.push(ii); });
    if(isSearching && visibleIndexes.length === 0) return;
    totalMatches += visibleIndexes.length;
    wrap.appendChild(renderCategoryBlock(cat, ci, isSearching ? visibleIndexes : null));
  });

  const countEl = document.getElementById('searchCount');
  if(isSearching){
    countEl.textContent = totalMatches > 0 ? `${totalMatches} مورد پیدا شد` : '';
    addCatWrap.style.display = 'none';
    if(totalMatches === 0){ wrap.innerHTML = '<div class="no-results">هیچ آیتمی با این جستجو پیدا نشد</div>'; }
  } else {
    countEl.textContent = '';
    addCatWrap.style.display = 'block';
  }
}

function renderCategoryBlock(cat, ci, filterIndexes){
  const block = document.createElement('div');
  block.className = 'cat-block';
  const header = document.createElement('div');
  header.className = 'cat-header';
  header.innerHTML = `
    <input type="text" class="cat-title-input" value="${escapeHtml(cat.title)}" onchange="updateCatTitle(${ci}, this.value)">
    <button class="cat-del" onclick="deleteCategory(${ci})" title="حذف دسته">🗑</button>
  `;
  block.appendChild(header);

  const indexesToShow = filterIndexes !== null ? filterIndexes : cat.items.map((_, i) => i);
  indexesToShow.forEach(ii => { block.appendChild(renderItemRow(cat.items[ii], ci, ii, filterIndexes !== null)); });

  if(filterIndexes === null){
    const addBtn = document.createElement('button');
    addBtn.className = 'add-item-btn';
    addBtn.textContent = '+ افزودن آیتم به این دسته';
    addBtn.onclick = () => addItem(ci);
    block.appendChild(addBtn);
  }
  return block;
}

function renderItemRow(item, ci, ii, showCatTag){
  const row = document.createElement('div');
  row.className = 'item-row';
  const isSingle = item.single !== undefined;
  const catTagHtml = showCatTag ? `<div class="cat-name-tag">${escapeHtml(menuData.categories[ci].title)}</div>` : '';

  row.innerHTML = `
    ${catTagHtml}
    <div class="field-group">
      <span class="field-label">نام آیتم</span>
      <input type="text" value="${escapeHtml(item.name||'')}" onchange="updateItemField(${ci},${ii},'name',this.value)">
    </div>
    <div class="field-group">
      <span class="field-label">توضیحات (اختیاری)</span>
      <textarea onchange="updateItemField(${ci},${ii},'desc',this.value)">${escapeHtml(item.desc||'')}</textarea>
    </div>
    <div class="field-group">
      <span class="field-label">برچسب (مثلاً «ویژه» - اختیاری)</span>
      <div class="tag-input-wrap">
        <input type="text" value="${escapeHtml(item.tag||'')}" placeholder="ویژه" onchange="updateItemField(${ci},${ii},'tag',this.value)">
      </div>
    </div>
    <div class="single-price-toggle">
      <button type="button" class="toggle-btn ${!isSingle?'active':''}" onclick="setPriceMode(${ci},${ii},false)">چند قیمتی (سایز/نفر)</button>
      <button type="button" class="toggle-btn ${isSingle?'active':''}" onclick="setPriceMode(${ci},${ii},true)">قیمت واحد</button>
    </div>
    <div id="priceArea-${ci}-${ii}"></div>
    <div class="item-row-actions">
      <button class="del-item-btn" onclick="deleteItem(${ci},${ii})">حذف این آیتم</button>
    </div>
  `;
  renderPriceArea(row.querySelector(`#priceArea-${ci}-${ii}`), item, ci, ii);
  return row;
}

function renderPriceArea(container, item, ci, ii){
  container.innerHTML = '';
  const isSingle = item.single !== undefined;
  if(isSingle){
    const g = document.createElement('div');
    g.className = 'field-group';
    g.innerHTML = `<span class="field-label">قیمت (تومان)</span><input type="text" inputmode="numeric" value="${item.single||0}" onchange="updateSinglePrice(${ci},${ii},this.value)">`;
    container.appendChild(g);
  } else {
    const prices = item.prices || {};
    // مرتب‌سازی قیمت‌ها بر اساس ترتیب دلخواه
    const sortedEntries = Object.entries(prices).sort((a,b) => {
      const indexA = PRICE_ORDER.indexOf(a[0]);
      const indexB = PRICE_ORDER.indexOf(b[0]);
      if(indexA === -1) return 1;
      if(indexB === -1) return -1;
      return indexA - indexB;
    });
    sortedEntries.forEach(([label, price]) => {
      const g = document.createElement('div');
      g.className = 'price-grid';
      g.innerHTML = `
        <input type="text" value="${escapeHtml(label)}" placeholder="برچسب" onchange="updatePriceLabel(${ci},${ii},'${escapeAttr(label)}',this.value)">
        <input type="text" inputmode="numeric" value="${price}" placeholder="قیمت" onchange="updatePriceValue(${ci},${ii},'${escapeAttr(label)}',this.value)">
        <button type="button" class="mini-btn" onclick="deletePrice(${ci},${ii},'${escapeAttr(label)}')">✕</button>
      `;
      container.appendChild(g);
    });
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'add-price-btn';
    addBtn.textContent = '+ افزودن سایز/قیمت';
    addBtn.onclick = () => addPrice(ci, ii);
    container.appendChild(addBtn);
  }
}

function updateCatTitle(ci, val){ menuData.categories[ci].title = val; }
function deleteCategory(ci){ if(!confirm('این دسته‌بندی و همه آیتم‌هاش حذف بشه؟')) return; menuData.categories.splice(ci,1); renderCategories(); }
function addCategory(){ menuData.categories.push({id:'cat-'+Date.now(), title:'دسته‌بندی جدید', items:[]}); renderCategories(); }
function addItem(ci){ menuData.categories[ci].items.push({name:'آیتم جدید', desc:'', prices:{'قیمت':0}}); renderCategories(); }
function deleteItem(ci, ii){ menuData.categories[ci].items.splice(ii,1); renderCategories(); }

function updateItemField(ci, ii, field, val){
  if(field === 'tag' && val.trim()===''){ delete menuData.categories[ci].items[ii].tag; }
  else { menuData.categories[ci].items[ii][field] = val; }
}

function setPriceMode(ci, ii, single){
  const item = menuData.categories[ci].items[ii];
  if(single){ item.single = 0; delete item.prices; }
  else { item.prices = {'قیمت':0}; delete item.single; }
  renderCategories();
}

function updateSinglePrice(ci, ii, val){ menuData.categories[ci].items[ii].single = parseInt(val.replace(/[^0-9]/g,''))||0; }

function addPrice(ci, ii){
  const item = menuData.categories[ci].items[ii];
  if(!item.prices) item.prices = {};
  let key = 'قیمت جدید'; let n = 1;
  while(item.prices.hasOwnProperty(key)){ key = 'قیمت جدید ' + (++n); }
  item.prices[key] = 0;
  renderCategories();
}

function updatePriceLabel(ci, ii, oldLabel, newLabel){
  const prices = menuData.categories[ci].items[ii].prices;
  const val = prices[oldLabel];
  const newPrices = {};
  Object.entries(prices).forEach(([k,v]) => { newPrices[k === oldLabel ? newLabel : k] = k === oldLabel ? val : v; });
  menuData.categories[ci].items[ii].prices = newPrices;
}

function updatePriceValue(ci, ii, label, val){ menuData.categories[ci].items[ii].prices[label] = parseInt(val.replace(/[^0-9]/g,''))||0; }
function deletePrice(ci, ii, label){ delete menuData.categories[ci].items[ii].prices[label]; renderCategories(); }

async function saveData(){
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'در حال ذخیره...';
  storedRecord.data = menuData;
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.${SUPABASE_ROW_ID}`, {
      method:'PATCH',
      headers:{
        'Content-Type':'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ data: menuData })
    });
    if(!res.ok) throw new Error('save-fail');
    showStatus('ok', '✓ تغییرات با موفقیت ذخیره شد', true);
  }catch(e){
    showStatus('err', 'ذخیره ناموفق بود. اتصال اینترنت را بررسی کن و دوباره تلاش کن.');
  }
  btn.disabled = false;
  btn.textContent = 'ذخیره تغییرات';
}

if(checkAuth()){ initApp(); }
</script>
